  }, 6000);

<script>
  (function () {
    const PREFIX = "gate_register__";
    window.storage = {
      async get(key, shared) {
        const raw = localStorage.getItem(PREFIX + key);
        if (raw === null) return null;
        return { key, value: raw, shared: !!shared };
      },
      async set(key, value, shared) {
        localStorage.setItem(PREFIX + key, value);
        return { key, value, shared: !!shared };
      },
      async delete(key, shared) {
        localStorage.removeItem(PREFIX + key);
        return { key, deleted: true, shared: !!shared };
      },
      async list(prefix, shared) {
        const p = PREFIX + (prefix || "");
        const keys = Object.keys(localStorage).filter((k) => k.startsWith(p)).map((k) => k.slice(PREFIX.length));
        return { keys, prefix, shared: !!shared };
      },
    };
  })();
</script>

const uid = (p = "") => p + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);

async function sha256(text) {
  try {
    const enc = new TextEncoder().encode(text);
    const buf = await crypto.subtle.digest("SHA-256", enc);
    return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
  } catch {
    // fallback simple hash if subtle crypto unavailable
    let h = 0;
    for (let i = 0; i < text.length; i++) { h = (h << 5) - h + text.charCodeAt(i); h |= 0; }
    return "fb" + Math.abs(h).toString(16);
  }
}

function todayStr(d = new Date()) {
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function nowTimeStr(d = new Date()) {
  return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}:${String(d.getSeconds()).padStart(2, "0")}`;
}
function shiftTimeStr(hhmm, deltaMinutes) {
  const [h, m] = hhmm.split(":").map(Number);
  let total = ((h * 60 + m + deltaMinutes) % 1440 + 1440) % 1440;
  return `${String(Math.floor(total / 60)).padStart(2, "0")}:${String(total % 60).padStart(2, "0")}`;
}
function fmtTime(t) {
  if (!t) return "—";
  const [h, m] = t.split(":");
  const hh = parseInt(h, 10);
  const ampm = hh >= 12 ? "PM" : "AM";
  const h12 = hh % 12 === 0 ? 12 : hh % 12;
  return `${h12}:${m} ${ampm}`;
}
function timeGreeting() {
  const h = new Date().getHours();
  if (h < 12) return "Good morning";
  if (h < 17) return "Good afternoon";
  return "Good evening";
}
function fmtDate(dstr) {
  if (!dstr) return "—";
  const d = new Date(dstr + "T00:00:00");
  return d.toLocaleDateString(undefined, { weekday: "short", year: "numeric", month: "short", day: "numeric" });
}
function minutesBetween(dateStr, timeIn, timeOut) {
  const a = new Date(`${dateStr}T${timeIn}`);
  const b = new Date(`${dateStr}T${timeOut}`);
  let diff = Math.round((b - a) / 60000);
  if (diff < 0) diff += 1440;
  return diff;
}
function fmtDuration(mins) {
  if (mins == null) return "—";
  const h = Math.floor(mins / 60), m = mins % 60;
  return `${h}h ${m}m`;
}
function overtimeMinutes(totalMinutes, shiftHours) {
  if (totalMinutes == null || !shiftHours) return 0;
  const limit = shiftHours * 60;
  return totalMinutes > limit ? totalMinutes - limit : 0;
}
function elapsedMinutes(dateStr, timeIn) {
  return Math.round((Date.now() - new Date(`${dateStr}T${timeIn}`)) / 60000);
}
function findLeave(leaves, employeeId, dateStr) {
  return leaves.find((l) => l.employee_id === employeeId && dateStr >= l.date_from && dateStr <= l.date_to) || null;
}
function stockLevel(itemId, movements) {
  return movements.filter((m) => m.item_id === itemId).reduce((s, m) => s + (m.type === "IN" ? m.quantity : -m.quantity), 0);
}
function handoverItemOk(item) {
  if (item.type === "quantity") return item.actual_quantity != null && item.actual_quantity >= item.expected_quantity;
  return item.present === true;
}
function startOfWeek(d) {
  const dt = new Date(d);
  const day = dt.getDay();
  const diff = dt.getDate() - day;
  return new Date(dt.setDate(diff));
}
function toCSV(rows, headers) {
  const esc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const lines = [headers.map((h) => esc(h.label)).join(",")];
  rows.forEach((r) => lines.push(headers.map((h) => esc(h.get(r))).join(",")));
  return lines.join("\n");
}
function downloadFile(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

/* ---------------------------------------------------------------------
   REPORT SCHEDULING HELPERS
   Artifacts have no server/cron, so "every day / weekly / monthly" is
   implemented as a due-reminder inside the app: whoever opens it sees a
   banner once a report is due, and one tap builds the report and opens
   it in the device's email app (with the CSV downloaded to attach).
--------------------------------------------------------------------- */
function getPeriodRange(freq, ref = new Date()) {
  const day = todayStr(ref);
  if (freq === "weekly") {
    const start = startOfWeek(ref);
    const end = new Date(start); end.setDate(end.getDate() + 6);
    return { from: todayStr(start), to: todayStr(end), label: `${fmtDate(todayStr(start))} – ${fmtDate(todayStr(end))}` };
  }
  if (freq === "monthly") {
    const y = ref.getFullYear(), m = ref.getMonth();
    const from = `${y}-${String(m + 1).padStart(2, "0")}-01`;
    const last = new Date(y, m + 1, 0).getDate();
    const to = `${y}-${String(m + 1).padStart(2, "0")}-${String(last).padStart(2, "0")}`;
    return { from, to, label: ref.toLocaleDateString(undefined, { month: "long", year: "numeric" }) };
  }
  return { from: day, to: day, label: fmtDate(day) };
}
function isReportDue(rd) {
  if (!rd || !rd.enabled || !rd.recipient_email) return false;
  const today = todayStr();
  if (!rd.last_sent) return true;
  if (rd.frequency === "weekly") return todayStr(startOfWeek(new Date(rd.last_sent + "T00:00:00"))) !== todayStr(startOfWeek(new Date()));
  if (rd.frequency === "monthly") return rd.last_sent.slice(0, 7) !== today.slice(0, 7);
  return rd.last_sent !== today; // daily
}
function buildReportPayload(freq, employees, attendance, empById, settings) {
  const shiftHours = (settings && settings.shift_hours) || 9;
  const { from, to, label } = getPeriodRange(freq);
  const rows = attendance.filter((a) => a.date >= from && a.date <= to).map((a) => ({ ...a, emp: empById[a.employee_id] })).filter((r) => r.emp);
  rows.sort((a, b) => (b.date + b.time_in).localeCompare(a.date + a.time_in));
  const inside = rows.filter((r) => r.status === "INSIDE").length;
  const overtimeTotal = rows.reduce((s, r) => s + overtimeMinutes(r.total_minutes, shiftHours), 0);
  const overtimeCount = rows.filter((r) => overtimeMinutes(r.total_minutes, shiftHours) > 0).length;
  const totalMinutes = rows.reduce((s, r) => s + (r.total_minutes || 0), 0);
  const activeCount = employees.filter((e) => e.active).length;
  const freqLabel = { daily: "Daily", weekly: "Weekly", monthly: "Monthly" }[freq] || "Attendance";

  const subject = `${freqLabel} Gate Attendance Report — ${label}`;
  const lines = [
    `${freqLabel} Gate Attendance Report`, `Period: ${label}`, "",
    `Total active employees: ${activeCount}`, `Attendance records: ${rows.length}`,
    `Currently inside: ${inside}`, `Standard shift: ${shiftHours}h`, `Overtime records: ${overtimeCount} (${fmtDuration(overtimeTotal)} total)`,
    `Total hours logged: ${fmtDuration(totalMinutes)}`, "",
    "Recent entries:",
    ...rows.slice(0, 15).map((r) => {
      const ot = overtimeMinutes(r.total_minutes, shiftHours);
      return `- ${r.date} ${r.emp.name} (${r.emp.employee_number}): IN ${fmtTime(r.time_in)}${r.time_out ? ", OUT " + fmtTime(r.time_out) : " (still inside)"}${ot > 0 ? ` [OVERTIME +${fmtDuration(ot)}]` : ""}`;
    }),
    rows.length > 15 ? `…and ${rows.length - 15} more record(s) — see attached CSV for the full list.` : "",
    "", "Sent from the Aramex Gatehouse Register app.",
  ].filter(Boolean);

  const csvHeaders = [
    { label: "Date", get: (r) => r.date }, { label: "Employee", get: (r) => r.emp.name }, { label: "Employee ID", get: (r) => r.emp.employee_number },

async function loadKey(key, fallback) {
  try {
    const res = await window.storage.get(key, true);
    return res && res.value ? JSON.parse(res.value) : fallback;
  } catch { return fallback; }
}
async function saveKey(key, value) {
  try { await window.storage.set(key, JSON.stringify(value), true); } catch (e) { console.error("storage save failed", key, e); }
}

/* ---------------------------------------------------------------------
   SHARED DB SYNC (Claude's cross-device db capability, when available)
   Keeps the app's existing "replace the whole array" call sites unchanged
   by diffing old vs new array and writing only the changed documents —
   this is what makes two devices checking people in at the same time
   not clobber each other.
--------------------------------------------------------------------- */
function cleanForStore(obj) {
  // Firestore rejects `undefined` field values outright; Claude's db is fine
  // with them but there's no reason not to normalize either way.
  return JSON.parse(JSON.stringify(obj));
}
async function syncArrayToCollection(db, collectionPath, prevArray, nextArray) {
  const prevById = new Map((prevArray || []).map((x) => [x.id, x]));
  const nextById = new Map((nextArray || []).map((x) => [x.id, x]));
  const col = db.collection(collectionPath);
  const ops = [];
  for (const [id, rec] of nextById) {
    const prev = prevById.get(id);
    if (!prev || JSON.stringify(prev) !== JSON.stringify(rec)) ops.push(col.doc(id).set(cleanForStore(rec)));
  }
  for (const id of prevById.keys()) {
    if (!nextById.has(id)) ops.push(col.doc(id).delete());
  }
  await Promise.all(ops);
}

/* ---------------------------------------------------------------------
   FIREBASE SYNC (optional — for a copy of this app hosted outside Claude,
   e.g. on GitHub Pages, where Claude's own db capability isn't present).
   The Firestore compat SDK's collection/doc/onSnapshot shape is close
   enough to Claude's db capability that it can be used as a drop-in
   dbApiRef — no separate adapter needed.
--------------------------------------------------------------------- */
const FIREBASE_CONFIG_KEY = "gate_register__firebase_config";
function getSavedFirebaseConfig() {
  try {
    const raw = localStorage.getItem(FIREBASE_CONFIG_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}
function saveFirebaseConfig(cfg) {
  localStorage.setItem(FIREBASE_CONFIG_KEY, JSON.stringify(cfg));
}
function clearFirebaseConfig() {
  localStorage.removeItem(FIREBASE_CONFIG_KEY);
}
function encodeFirebaseConfig(cfg) {
  try { return btoa(JSON.stringify(cfg)); } catch { return ""; }
}
function decodeFirebaseConfig(code) {
  try {
    const cfg = JSON.parse(atob(code.trim()));
    if (!cfg.apiKey || !cfg.authDomain || !cfg.projectId || !cfg.appId) return null;
    return cfg;
  } catch { return null; }
}
async function initFirebaseDb(config) {
  if (!window.firebase) throw new Error("Firebase SDK did not load");
  const existing = window.firebase.apps && window.firebase.apps.length ? window.firebase.apps[0] : null;
  const app = existing || window.firebase.initializeApp(config);
  const auth = window.firebase.auth(app);
  if (!auth.currentUser) await auth.signInAnonymously();
  return window.firebase.firestore(app);
}

// Older saves had one shared `report_delivery` channel — carry it forward as the
// attendance channel the first time it's seen, rather than losing that setup.
function migrateSettings(raw) {
  if (!raw) return defaultSettings();
  let out = raw;
  if (!out.report_channels) {
    if (out.report_delivery) {
      const { report_delivery, ...rest } = out;
      out = { ...rest, report_channels: { attendance: report_delivery, security: defaultChannel(), inventory: defaultChannel() } };
    } else {
      out = { ...defaultSettings(), ...out };
    }
  }
  if (!out.handover_alert) out = { ...out, handover_alert: { recipient_name: "", recipient_email: "" } };
  if (!out.incident_alert) out = { ...out, incident_alert: { recipient_name: "", recipient_email: "" } };
  return out;
}

        border: `1px solid ${disabled ? "#C9C4B6" : t.bd}`, borderRadius: 8, padding: s.pad,
        fontFamily: FONT_SANS, fontWeight: 600, fontSize: s.fs, width: full ? "100%" : undefined,
        cursor: disabled ? "not-allowed" : "pointer", transition: "transform 0.05s ease",
      }}
      onMouseDown={(e) => { if (!disabled) e.currentTarget.style.transform = "scale(0.98)"; }}
      onMouseUp={(e) => { e.currentTarget.style.transform = "scale(1)"; }}
    >
      {Icon && <Icon size={s.fs + 2} />}
      {children}
    </button>
  );
}

function Field({ label, children }) {
  return (
    <label style={{ display: "block", marginBottom: 12 }}>
      <div style={{ fontSize: 12.5, fontFamily: FONT_SANS, fontWeight: 600, color: C.ink50, marginBottom: 5 }}>{label}</div>
      {children}
    </label>
  );
}
const inputStyle = {
  width: "100%", boxSizing: "border-box", border: `1px solid ${C.line}`, borderRadius: 7,
  padding: "10px 12px", fontFamily: FONT_SANS, fontSize: 14.5, background: "#fff", color: C.ink,
};

function Toast({ toast }) {
  if (!toast) return null;
  const ok = toast.type !== "error";
  return (
    <div style={{
      position: "fixed", top: 14, left: "50%", transform: "translateX(-50%)", zIndex: 200,
      background: ok ? C.greenDeep : C.redDeep, color: "#fff", padding: "12px 18px", borderRadius: 9,
      fontFamily: FONT_SANS, fontSize: 14, fontWeight: 600, boxShadow: "0 6px 20px rgba(0,0,0,0.25)",
      display: "flex", alignItems: "center", gap: 8, maxWidth: "90vw",
    }}>
      {ok ? <CheckCircle2 size={17} /> : <AlertTriangle size={17} />}
      <span>{toast.msg}</span>
    </div>
  );
}

function Modal({ title, onClose, children, wide }) {
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(22,28,36,0.55)", zIndex: 150, display: "flex", alignItems: "flex-end", justifyContent: "center" }} onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} style={{
        background: C.paper, width: "100%", maxWidth: wide ? 640 : 460, maxHeight: "88vh", overflowY: "auto",
        borderRadius: "16px 16px 0 0", padding: 20, boxShadow: "0 -8px 30px rgba(0,0,0,0.3)",
      }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
          <h3 style={{ fontFamily: FONT_SERIF, fontSize: 19, color: C.ink, margin: 0 }}>{title}</h3>
          <button onClick={onClose} style={{ background: "none", border: "none", cursor: "pointer", color: C.ink50, padding: 4 }}><X size={20} /></button>
        </div>
        {children}
      </div>
    </div>
  );
}

function EmptyState({ icon: Icon, title, sub }) {
  return (
    <div style={{ textAlign: "center", padding: "40px 20px", color: C.ink50 }}>
      <Icon size={30} style={{ opacity: 0.4, marginBottom: 10 }} />
      <div style={{ fontFamily: FONT_SANS, fontWeight: 600, fontSize: 14.5, color: C.ink }}>{title}</div>
      {sub && <div style={{ fontSize: 13, marginTop: 4 }}>{sub}</div>}
    </div>
  );
}

/* ---------------------------------------------------------------------
   APP
--------------------------------------------------------------------- */
function App() {
  const [booted, setBooted] = useState(false);
  const [employees, setEmployees] = useState([]);
  const [users, setUsers] = useState([]);
  const [attendance, setAttendance] = useState([]);
  const [audit, setAudit] = useState([]);
  const [leaves, setLeaves] = useState([]);
  const [visitors, setVisitors] = useState([]);
  const [stockItems, setStockItems] = useState([]);
  const [stockMovements, setStockMovements] = useState([]);
  const [handoverItems, setHandoverItems] = useState([]);
  const [handoverRecords, setHandoverRecords] = useState([]);
  const [incidents, setIncidents] = useState([]);
  const [settings, setSettings] = useState(defaultSettings());
  const [session, setSession] = useState(null); // {id,name,role}
  const [view, setView] = useState("dashboard");
  const [toast, setToast] = useState(null);
  const [busy, setBusy] = useState(false);
  const [syncMode, setSyncMode] = useState("checking"); // "checking" | "synced" | "firebase" | "local"
  const [canWriteShared, setCanWriteShared] = useState(null); // null = unknown/not applicable (Claude-sync only)
  const [firebaseError, setFirebaseError] = useState("");
  const dbApiRef = useRef(null);
  const dbModeRef = useRef("local");
  const employeesRef = useRef(employees); employeesRef.current = employees;
  const usersRef = useRef(users); usersRef.current = users;
  const attendanceRef = useRef(attendance); attendanceRef.current = attendance;
  const auditRef = useRef(audit); auditRef.current = audit;
  const leavesRef = useRef(leaves); leavesRef.current = leaves;
  const visitorsRef = useRef(visitors); visitorsRef.current = visitors;
  const stockItemsRef = useRef(stockItems); stockItemsRef.current = stockItems;
  const stockMovementsRef = useRef(stockMovements); stockMovementsRef.current = stockMovements;
  const handoverItemsRef = useRef(handoverItems); handoverItemsRef.current = handoverItems;
  const handoverRecordsRef = useRef(handoverRecords); handoverRecordsRef.current = handoverRecords;
  const incidentsRef = useRef(incidents); incidentsRef.current = incidents;

  const notify = useCallback((msg, type = "ok") => {
    setToast({ msg, type });
    setTimeout(() => setToast(null), 2800);
  }, []);

  // LOCAL (per-device) boot path — used when the shared db capability
  // isn't available: a downloaded standalone file, or an older preview.
  const bootLocal = useCallback(async () => {
    let emp = await loadKey(KEYS.employees, null);
    let usr = await loadKey(KEYS.users, null);
    let att = await loadKey(KEYS.attendance, null);
    let aud = await loadKey(KEYS.audit, null);
    let lv = await loadKey(KEYS.leaves, null);
    let vis = await loadKey(KEYS.visitors, null);
    let si = await loadKey(KEYS.stockItems, null);
    let sm = await loadKey(KEYS.stockMovements, null);
    let hi = await loadKey(KEYS.handoverItems, null);
    let hr = await loadKey(KEYS.handoverRecords, null);
    let inc = await loadKey(KEYS.incidents, null);
    let set = await loadKey(KEYS.settings, null);
    if (!usr || !Array.isArray(usr) || usr.length === 0) {
      const fresh = await buildFreshData();
      emp = emp && Array.isArray(emp) && emp.length ? emp : fresh.employees;
      usr = fresh.users;
      att = att && Array.isArray(att) ? att : fresh.attendance;
      aud = aud && Array.isArray(aud) ? aud : fresh.audit;
      lv = lv && Array.isArray(lv) ? lv : fresh.leaves;
      vis = vis && Array.isArray(vis) ? vis : fresh.visitors;
      si = si && Array.isArray(si) ? si : fresh.stockItems;
      sm = sm && Array.isArray(sm) ? sm : fresh.stockMovements;
      hi = hi && Array.isArray(hi) && hi.length ? hi : fresh.handoverItems;
      hr = hr && Array.isArray(hr) ? hr : fresh.handoverRecords;
      inc = inc && Array.isArray(inc) ? inc : fresh.incidents;
      set = set || fresh.settings;
      await Promise.all([
        saveKey(KEYS.employees, emp), saveKey(KEYS.users, usr), saveKey(KEYS.attendance, att),
        saveKey(KEYS.audit, aud), saveKey(KEYS.leaves, lv), saveKey(KEYS.visitors, vis),
        saveKey(KEYS.stockItems, si), saveKey(KEYS.stockMovements, sm),
        saveKey(KEYS.handoverItems, hi), saveKey(KEYS.handoverRecords, hr),
        saveKey(KEYS.incidents, inc), saveKey(KEYS.settings, set),
      ]);
    }
    setEmployees(emp || []); setUsers(usr || []); setAttendance(att || []);
    setAudit(aud || []); setLeaves(lv || []);
    setVisitors(vis || []); setStockItems(si || []); setStockMovements(sm || []);
    setHandoverItems(hi || []); setHandoverRecords(hr || []); setIncidents(inc || []);
    setSettings(migrateSettings(set));
    setSyncMode("local");
    setBooted(true);
  }, []);

  // SYNCED (shared db) boot path — live subscriptions so every device
  // that opens this page sees the same data in real time.
  useEffect(() => {
    let cancelled = false;
    let unsubs = [];
    (async () => {
      let db = null;
      let mode = "local";

      const fbConfig = getSavedFirebaseConfig();
      if (fbConfig) {
        try {
          db = await initFirebaseDb(fbConfig);
          mode = "firebase";
        } catch (e) {
          console.error("Firebase connect failed", e);
          setFirebaseError(e && e.message ? e.message : "Could not connect to Firebase");
        }
      }

      let hasClaude = false;
      if (!db) {
        hasClaude = typeof window !== "undefined" && window.claude && typeof window.claude.use === "function";
        db = hasClaude ? await window.claude.use("db") : null;
        if (db) mode = "synced";
      }

      if (cancelled) return;
      if (!db) { bootLocal(); return; }
      dbApiRef.current = db;
      dbModeRef.current = mode;

      if (mode === "synced") {
        const userCap = hasClaude ? await window.claude.use("user") : null;
        if (userCap && !cancelled) {
          try { setCanWriteShared(await userCap.can("data.write")); } catch { setCanWriteShared(null); }
        }
      }

      let usersSeeded = false;
      const unsubUsers = db.collection("users").onSnapshot(async (snap) => {
        if (cancelled) return;
        if (snap.empty && !usersSeeded) {
          usersSeeded = true;
          try {
            const accounts = await buildAccounts();
            await Promise.all(accounts.map((a) => db.collection("users").doc(a.id).set(a)));
          } catch (e) { console.error("seed accounts failed", e); }
          return; // the write above will re-trigger this snapshot with real data
        }
        setUsers(snap.docs.map((d) => d.data()));
        setBooted(true);
        setSyncMode(mode);
      }, (err) => {
        console.error("users sync error", err);
        if (mode === "firebase") setFirebaseError((err && err.message) || "Firebase rejected the connection — check your Firestore rules.");
        bootLocal();
      });
      unsubs.push(unsubUsers);

      unsubs.push(db.collection("employees").onSnapshot((snap) => {
        if (!cancelled) setEmployees(snap.docs.map((d) => d.data()));
      }, (err) => console.error("employees sync error", err)));

      unsubs.push(db.collection("attendance").onSnapshot((snap) => {
        if (!cancelled) setAttendance(snap.docs.map((d) => d.data()));
      }, (err) => console.error("attendance sync error", err)));

      unsubs.push(db.collection("auditLogs").onSnapshot((snap) => {
        if (!cancelled) setAudit(snap.docs.map((d) => d.data()));
      }, (err) => console.error("audit sync error", err)));

      unsubs.push(db.collection("leaves").onSnapshot((snap) => {
        if (!cancelled) setLeaves(snap.docs.map((d) => d.data()));
      }, (err) => console.error("leaves sync error", err)));

      unsubs.push(db.collection("visitors").onSnapshot((snap) => {
        if (!cancelled) setVisitors(snap.docs.map((d) => d.data()));
      }, (err) => console.error("visitors sync error", err)));

      unsubs.push(db.collection("stockItems").onSnapshot((snap) => {
        if (!cancelled) setStockItems(snap.docs.map((d) => d.data()));
      }, (err) => console.error("stockItems sync error", err)));

      unsubs.push(db.collection("stockMovements").onSnapshot((snap) => {
        if (!cancelled) setStockMovements(snap.docs.map((d) => d.data()));
      }, (err) => console.error("stockMovements sync error", err)));

      let handoverItemsSeeded = false;
      unsubs.push(db.collection("handoverItems").onSnapshot(async (snap) => {
        if (cancelled) return;
        if (snap.empty && !handoverItemsSeeded) {
          handoverItemsSeeded = true;
          try {
            const items = defaultHandoverItems();
            await Promise.all(items.map((it) => db.collection("handoverItems").doc(it.id).set(it)));
          } catch (e) { console.error("seed handover items failed", e); }
          return;
        }
        setHandoverItems(snap.docs.map((d) => d.data()));
      }, (err) => console.error("handoverItems sync error", err)));

      unsubs.push(db.collection("handoverRecords").onSnapshot((snap) => {
        if (!cancelled) setHandoverRecords(snap.docs.map((d) => d.data()));
      }, (err) => console.error("handoverRecords sync error", err)));

      unsubs.push(db.collection("incidents").onSnapshot((snap) => {
        if (!cancelled) setIncidents(snap.docs.map((d) => d.data()));
      }, (err) => console.error("incidents sync error", err)));

      unsubs.push(db.doc("config/app").onSnapshot((snap) => {
        if (cancelled) return;
        const data = snap.exists ? snap.data() : null;
        setSettings(migrateSettings(data));
        if (!snap.exists) {
          // first run: write the defaults so later readers see them too
          db.doc("config/app").set(defaultSettings()).catch((e) => console.error("settings seed failed", e));
        }
      }, (err) => console.error("settings sync error", err)));
    })();
    return () => { cancelled = true; unsubs.forEach((u) => { try { u(); } catch {} }); };
  }, [bootLocal]);

  const persist = {
    employees: async (next) => {
      setEmployees(next);
      const db = dbApiRef.current;
      if (db) await syncArrayToCollection(db, "employees", employeesRef.current, next);
      else await saveKey(KEYS.employees, next);
    },
    users: async (next) => {
      setUsers(next);
      const db = dbApiRef.current;
      if (db) await syncArrayToCollection(db, "users", usersRef.current, next);
      else await saveKey(KEYS.users, next);
    },
    attendance: async (next) => {
      setAttendance(next);
      const db = dbApiRef.current;
      if (db) await syncArrayToCollection(db, "attendance", attendanceRef.current, next);
      else await saveKey(KEYS.attendance, next);
    },
    audit: async (next) => {
      setAudit(next);
      const db = dbApiRef.current;
      if (db) await syncArrayToCollection(db, "auditLogs", auditRef.current, next);
      else await saveKey(KEYS.audit, next);
    },
    leaves: async (next) => {
      setLeaves(next);
      const db = dbApiRef.current;
      if (db) await syncArrayToCollection(db, "leaves", leavesRef.current, next);
      else await saveKey(KEYS.leaves, next);
    },
    visitors: async (next) => {
      setVisitors(next);
      const db = dbApiRef.current;
      if (db) await syncArrayToCollection(db, "visitors", visitorsRef.current, next);
      else await saveKey(KEYS.visitors, next);
    },
    stockItems: async (next) => {
      setStockItems(next);
      const db = dbApiRef.current;
      if (db) await syncArrayToCollection(db, "stockItems", stockItemsRef.current, next);
      else await saveKey(KEYS.stockItems, next);
    },
    stockMovements: async (next) => {
      setStockMovements(next);
      const db = dbApiRef.current;
      if (db) await syncArrayToCollection(db, "stockMovements", stockMovementsRef.current, next);
      else await saveKey(KEYS.stockMovements, next);
    },
    handoverItems: async (next) => {
      setHandoverItems(next);
      const db = dbApiRef.current;
      if (db) await syncArrayToCollection(db, "handoverItems", handoverItemsRef.current, next);
      else await saveKey(KEYS.handoverItems, next);
    },
    handoverRecords: async (next) => {
      setHandoverRecords(next);
      const db = dbApiRef.current;
      if (db) await syncArrayToCollection(db, "handoverRecords", handoverRecordsRef.current, next);
      else await saveKey(KEYS.handoverRecords, next);
    },
    incidents: async (next) => {
      setIncidents(next);
      const db = dbApiRef.current;
      if (db) await syncArrayToCollection(db, "incidents", incidentsRef.current, next);
      else await saveKey(KEYS.incidents, next);
    },
    settings: async (next) => {
      setSettings(next);
      const db = dbApiRef.current;
      if (db) await db.doc("config/app").set(next);
      else await saveKey(KEYS.settings, next);
    },
  };

  const fixLoginAccounts = useCallback(async () => {
    const accounts = await buildAccounts();
    await persist.users(accounts);
    notify("Login accounts reset. Try shihabuddin / manager123, arslan / guard123, or amir / guard123.");
  }, [notify]);
  const empById = useMemo(() => Object.fromEntries(employees.map((e) => [e.id, e])), [employees]);
  const today = todayStr();

  const sendReport = useCallback(async (section, freq) => {
    const channels = settings.report_channels || { attendance: defaultChannel(), security: defaultChannel(), inventory: defaultChannel() };
    const ch = channels[section] || defaultChannel();
    const sectionLabel = { attendance: "Attendance", security: "Security", inventory: "Inventory" }[section] || section;
    if (!ch.recipient_email) { notify(`Add the recipient's email for ${sectionLabel} reports in Settings first`, "error"); return; }

    let payload;
    if (section === "attendance") payload = buildReportPayload(freq, employees, attendance, empById, settings);
    else if (section === "security") payload = buildSecurityReportPayload(freq, visitors);
    else payload = buildInventoryReportPayload(freq, stockItems, stockMovements);

    downloadFile(payload.filename, payload.csv, "text/csv");
    const body = payload.body + "\n\n(A CSV of the full period was just downloaded to your device — attach it to this email before sending.)";
    const mailto = `mailto:${encodeURIComponent(ch.recipient_email)}?subject=${encodeURIComponent(payload.subject)}&body=${encodeURIComponent(body)}`;
    const a = document.createElement("a");
    a.href = mailto; a.target = "_blank";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    await persist.settings({ ...settings, report_channels: { ...channels, [section]: { ...ch, last_sent: todayStr() } } });
    notify(`${payload.label} ${sectionLabel.toLowerCase()} report ready — check your email app`);
  }, [settings, employees, attendance, empById, visitors, stockItems, stockMovements, notify]);

  if (!booted) {
    return (
      <div style={{ minHeight: "100vh", background: C.paper, display: "flex", alignItems: "center", justifyContent: "center", flexDirection: "column", gap: 10 }}>
        <Loader2 className="spin" size={26} color={C.navy} />
        <div style={{ fontFamily: FONT_SANS, color: C.ink50, fontSize: 13 }}>Opening the gate register…</div>
        <style>{`.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}`}</style>
      </div>
    );
  }

  if (!session) {
    return <LoginScreen users={users} onLogin={setSession} notify={notify} onResetAccounts={fixLoginAccounts} />;
  }

  return (
    <div style={{ minHeight: "100vh", background: C.paper, fontFamily: FONT_SANS, paddingBottom: 76 }}>
      <style>{`
        @media print {
          .no-print { display: none !important; }
          body { background: #fff !important; }
        }
        ::selection { background: ${C.amber}; color: #fff; }
      `}</style>
      <Toast toast={toast} />
      <Header session={session} onLogout={() => { setSession(null); setView("dashboard"); }} syncMode={syncMode} canWriteShared={canWriteShared} />
      {syncMode === "synced" && canWriteShared === false && (
        <div style={{ background: "#FEF3C7", borderBottom: `1px solid #FDE68A`, padding: "9px 14px", textAlign: "center", fontSize: 12.5, color: C.amberDeep }}>
          You can see live data here, but can't save changes yet — ask whoever owns this page to give you edit access (see Settings for details).
        </div>
      )}
      <main style={{ maxWidth: 1100, margin: "0 auto", padding: "18px 16px 30px" }}>
        {view === "dashboard" && (
          <Dashboard
            session={session} employees={employees} attendance={attendance} settings={settings}
            empById={empById} today={today} goto={setView} sendReport={sendReport} leaves={leaves}
            stockItems={stockItems} stockMovements={stockMovements} visitors={visitors} handoverRecords={handoverRecords} incidents={incidents}
          />
        )}
        {view === "checkin" && (
          <CheckInScreen
            session={session} employees={employees} attendance={attendance} settings={settings} leaves={leaves}
            persistAttendance={persist.attendance} audit={audit} persistAudit={persist.audit}
            notify={notify} today={today}
          />
        )}
        {view === "checkout" && (
          <CheckOutScreen
            session={session} employees={employees} attendance={attendance} settings={settings}
            persistAttendance={persist.attendance} audit={audit} persistAudit={persist.audit}
            notify={notify} today={today}
          />
        )}
        {view === "attendance" && (
          <AttendanceToday
            employees={employees} attendance={attendance} empById={empById} today={today} settings={settings} leaves={leaves}
          />
        )}
        {view === "history" && (
          <HistoryScreen employees={employees} attendance={attendance} empById={empById} session={session} settings={settings}
            persistAttendance={persist.attendance} audit={audit} persistAudit={persist.audit} notify={notify} />
        )}
        {view === "leave" && (
          <LeaveScreen session={session} employees={employees} empById={empById} leaves={leaves}
            persistLeaves={persist.leaves} notify={notify} />
        )}
        {view === "visitors" && (
          <VisitorsScreen session={session} visitors={visitors} persistVisitors={persist.visitors} notify={notify} today={today} />
        )}
        {view === "inventory" && (
          <InventoryScreen session={session} stockItems={stockItems} stockMovements={stockMovements}
            persistStockItems={persist.stockItems} persistStockMovements={persist.stockMovements} notify={notify} />
        )}
        {view === "handover" && (
          <HandoverScreen session={session} users={users} handoverItems={handoverItems} handoverRecords={handoverRecords}
            persistHandoverItems={persist.handoverItems} persistHandoverRecords={persist.handoverRecords}
            settings={settings} persistSettings={persist.settings} notify={notify} />
        )}
        {view === "incidents" && (
          <IncidentsScreen session={session} incidents={incidents} persistIncidents={persist.incidents}
            settings={settings} persistSettings={persist.settings} notify={notify} />
        )}
        {view === "employees" && session.role === "admin" && (
          <EmployeesScreen employees={employees} persistEmployees={persist.employees} notify={notify} />
        )}
        {view === "reports" && session.role === "admin" && (
          <ReportsScreen employees={employees} attendance={attendance} empById={empById} settings={settings} />
        )}
        {view === "settings" && session.role === "admin" && (
          <SettingsScreen settings={settings} persistSettings={persist.settings} users={users}
            persistUsers={persist.users} notify={notify} sendReport={sendReport} syncMode={syncMode} canWriteShared={canWriteShared} firebaseError={firebaseError}
            loadSample={async () => {
              setBusy(true);
              const sample = await buildSampleData();
              await persist.employees(sample.employees); await persist.users(sample.users);
              await persist.attendance(sample.attendance); await persist.audit(sample.audit);
              await persist.leaves(sample.leaves); await persist.visitors(sample.visitors);
              await persist.stockItems(sample.stockItems); await persist.stockMovements(sample.stockMovements);
              await persist.handoverItems(sample.handoverItems); await persist.handoverRecords(sample.handoverRecords);
              await persist.incidents(sample.incidents); await persist.settings(sample.settings);
              setBusy(false);
              notify("Sample data loaded");
            }}
            eraseAll={async () => {
              setBusy(true);
              const fresh = await buildFreshData();
              await persist.employees(fresh.employees); await persist.users(fresh.users);
              await persist.attendance(fresh.attendance); await persist.audit(fresh.audit);
              await persist.leaves(fresh.leaves); await persist.visitors(fresh.visitors);
              await persist.stockItems(fresh.stockItems); await persist.stockMovements(fresh.stockMovements);
              await persist.handoverItems(fresh.handoverItems); await persist.handoverRecords(fresh.handoverRecords);
              await persist.incidents(fresh.incidents); await persist.settings(fresh.settings);
              setBusy(false);
              notify("All data erased — starting fresh");
            }}
            busy={busy}
          />
        )}
      </main>
      <BottomNav view={view} setView={setView} role={session.role} />
    </div>
  );
}

/* ---------------------------------------------------------------------
   HEADER + BOTTOM NAV
   Aramex-branded top bar (red wordmark + "Gatehouse Register" subtitle)
   with a bottom tab bar, icon + name on every tab.
--------------------------------------------------------------------- */
function Header({ session, onLogout, syncMode, canWriteShared }) {
  const dotColor = syncMode === "firebase" ? "#10B981" : syncMode === "synced" ? (canWriteShared === false ? C.amberDeep : "#10B981") : C.ink50;
  const syncLabel = syncMode === "firebase" ? "Synced via Firebase" : syncMode === "synced" ? (canWriteShared === false ? "Synced · read-only" : "Synced across devices") : "Local device only";

  return (

function FirebaseConnectPanel({ onConnected, initial }) {
  const [mode, setMode] = useState("code"); // "code" | "manual"
  const [code, setCode] = useState("");
  const [fbForm, setFbForm] = useState(initial || { apiKey: "", authDomain: "", projectId: "", storageBucket: "", messagingSenderId: "", appId: "" });
  const [error, setError] = useState("");

  const connectWithCode = () => {
    const cfg = decodeFirebaseConfig(code);
    if (!cfg) { setError("That code doesn't look right — ask the admin to resend it."); return; }
    saveFirebaseConfig(cfg);
    onConnected();
  };
  const connectManual = () => {
    if (!fbForm.apiKey.trim() || !fbForm.authDomain.trim() || !fbForm.projectId.trim() || !fbForm.appId.trim()) {
      setError("API Key, Auth Domain, Project ID, and App ID are required"); return;
    }
    saveFirebaseConfig(fbForm);
    onConnected();
  };

  return (
    <div>
      {mode === "code" ? (
        <>
          <Field label="Connection code (from your admin)">
            <textarea style={{ ...inputStyle, minHeight: 64, fontFamily: FONT_MONO, fontSize: 11.5 }} value={code}
              onChange={(e) => { setCode(e.target.value); setError(""); }} placeholder="Paste the code your admin sent you" />
          </Field>
          {error && <div style={{ color: C.redDeep, fontSize: 12, marginBottom: 8 }}>{error}</div>}
          <Btn full tone="navy" onClick={connectWithCode} disabled={!code.trim()}>Connect</Btn>
          <button type="button" onClick={() => { setMode("manual"); setError(""); }} style={{ background: "none", border: "none", color: C.ink50, fontSize: 11.5, marginTop: 10, cursor: "pointer", textDecoration: "underline", display: "block" }}>
            Enter the Firebase details manually instead
          </button>
        </>
      ) : (
        <>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
            <Field label="API Key"><input style={inputStyle} value={fbForm.apiKey} onChange={(e) => setFbForm((f) => ({ ...f, apiKey: e.target.value }))} /></Field>
            <Field label="Auth Domain"><input style={inputStyle} value={fbForm.authDomain} onChange={(e) => setFbForm((f) => ({ ...f, authDomain: e.target.value }))} /></Field>
            <Field label="Project ID"><input style={inputStyle} value={fbForm.projectId} onChange={(e) => setFbForm((f) => ({ ...f, projectId: e.target.value }))} /></Field>
            <Field label="App ID"><input style={inputStyle} value={fbForm.appId} onChange={(e) => setFbForm((f) => ({ ...f, appId: e.target.value }))} /></Field>
            <Field label="Storage Bucket (optional)"><input style={inputStyle} value={fbForm.storageBucket} onChange={(e) => setFbForm((f) => ({ ...f, storageBucket: e.target.value }))} /></Field>
            <Field label="Sender ID (optional)"><input style={inputStyle} value={fbForm.messagingSenderId} onChange={(e) => setFbForm((f) => ({ ...f, messagingSenderId: e.target.value }))} /></Field>
          </div>
          {error && <div style={{ color: C.redDeep, fontSize: 12, marginBottom: 8 }}>{error}</div>}
          <Btn full tone="navy" onClick={connectManual}>Connect</Btn>
          <button type="button" onClick={() => { setMode("code"); setError(""); }} style={{ background: "none", border: "none", color: C.ink50, fontSize: 11.5, marginTop: 10, cursor: "pointer", textDecoration: "underline", display: "block" }}>
            Use a connection code instead
          </button>
        </>
      )}
    </div>
  );
}

function LoginScreen({ users, onLogin, notify, onResetAccounts }) {
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [show, setShow] = useState(false);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  const [confirmingReset, setConfirmingReset] = useState(false);
  const [showFbConnect, setShowFbConnect] = useState(false);
  const [fbJustConnected, setFbJustConnected] = useState(false);
  const alreadyConnected = !!getSavedFirebaseConfig();

  const doLogin = async (u, p) => {
    setError("");
    if (!u.trim() || !p) { setError("Enter a username and password."); return; }
    if (!users || users.length === 0) { setError("Accounts haven't finished loading yet — wait a second and try again."); return; }
    setBusy(true);
    let hash;
    try {
      hash = await sha256(p);
    } catch (e) {
      setBusy(false);
      setError("This device couldn't process the login securely. Try reloading the app.");
      return;
    }
    const match = users.find((x) => x.username.trim().toLowerCase() === u.trim().toLowerCase());
    setBusy(false);
    if (!match) { setError(`No account found for username "${u.trim()}".`); return; }
    if (!match.active) { setError("This account has been disabled by the admin."); return; }
    if (match.passwordHash !== hash) { setError("Incorrect password."); return; }
    onLogin({ id: match.id, name: match.name, role: match.role });
  };

  return (
    <div style={{ minHeight: "100vh", background: `linear-gradient(180deg, ${C.navy}, ${C.slate})`, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 20 }}>
      <div style={{ width: "100%", maxWidth: 360 }}>
        <div style={{ textAlign: "center", marginBottom: 26 }}>
          <div style={{ background: "#fff", borderRadius: 14, padding: "14px 10px", marginBottom: 14, boxShadow: "0 10px 30px rgba(0,0,0,0.25)" }}>
            <div style={{ fontFamily: FONT_SANS, fontSize: 26, fontWeight: 800, color: C.aramexRed, letterSpacing: 0.5 }}>ARAMEX</div>
            <div style={{ fontFamily: FONT_SERIF, fontSize: 14, color: C.ink50 }}>Gatehouse Register</div>
          </div>
          <div style={{ fontFamily: FONT_MONO, fontSize: 11, color: "#C7CEDB", letterSpacing: 0.5 }}>DIGITAL GATE REGISTER · V2</div>
        </div>

        <div style={{ background: C.paper, borderRadius: 14, padding: 22, boxShadow: "0 20px 50px rgba(0,0,0,0.35)" }}>
          <form onSubmit={(e) => { e.preventDefault(); doLogin(username, password); }}>
            <Field label="Username">
              <input style={inputStyle} value={username} onChange={(e) => setUsername(e.target.value)} placeholder="e.g. arslan" autoFocus autoCapitalize="none" autoCorrect="off" />
            </Field>
            <Field label="Password">
              <div style={{ position: "relative" }}>
                <input style={{ ...inputStyle, paddingRight: 38 }} type={show ? "text" : "password"} value={password} onChange={(e) => setPassword(e.target.value)} placeholder="••••••••" autoCapitalize="none" autoCorrect="off" />
                <button type="button" onClick={() => setShow((s) => !s)} style={{ position: "absolute", right: 8, top: 8, background: "none", border: "none", color: C.ink50, cursor: "pointer" }}>
                  {show ? <EyeOff size={17} /> : <Eye size={17} />}
                </button>
              </div>
            </Field>
            {error && (
              <div style={{ background: "#F7E7E5", color: C.redDeep, border: `1px solid #E9C3BE`, borderRadius: 8, padding: "9px 11px", fontSize: 13, marginBottom: 12, display: "flex", alignItems: "center", gap: 7 }}>
                <AlertTriangle size={15} style={{ flexShrink: 0 }} /> {error}
              </div>
            )}
            <div style={{ marginTop: 4 }}>
              <Btn full tone="amber" size="lg" icon={LogIn} type="submit" disabled={busy} onClick={(e) => { e.preventDefault(); doLogin(username, password); }}>{busy ? "Signing in…" : "Log In"}</Btn>
            </div>
          </form>

          <div style={{ marginTop: 18, paddingTop: 14, borderTop: `1px dashed ${C.line}` }}>
            <div style={{ fontSize: 11.5, color: C.ink50, marginBottom: 8, fontFamily: FONT_SANS, fontWeight: 600 }}>DEMO ACCOUNTS</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              {[
                { u: "arslan", p: "guard123", label: "Security Guard — Arslan Ahmed" },
                { u: "amir", p: "guard123", label: "Security Guard — Amir Hamja" },
                { u: "shihabuddin", p: "manager123", label: "Manager / Admin — Mr Shihabuddin" },
              ].map((d) => (
                <button key={d.u} onClick={() => { setUsername(d.u); setPassword(d.p); doLogin(d.u, d.p); }}
                  style={{ textAlign: "left", background: "#fff", border: `1px solid ${C.line}`, borderRadius: 8, padding: "8px 10px", cursor: "pointer", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <span style={{ fontSize: 13, color: C.ink }}>{d.label}</span>
                  <span style={{ fontFamily: FONT_MONO, fontSize: 11, color: C.ink50 }}>{d.u}</span>
                </button>
              ))}
            </div>
          </div>

          <div style={{ marginTop: 16, textAlign: "center" }}>
            {!confirmingReset ? (
              <button type="button" onClick={() => setConfirmingReset(true)} style={{ background: "none", border: "none", color: C.ink50, fontSize: 12, textDecoration: "underline", cursor: "pointer" }}>
                Trouble logging in? Reset login accounts
              </button>
            ) : (
              <div style={{ background: "#FCEFE0", border: `1px solid #F2D6A6`, borderRadius: 8, padding: "10px 12px", textAlign: "left" }}>
                <div style={{ fontSize: 12.5, color: C.ink, marginBottom: 8 }}>
                  This resets the shihabuddin/arslan/amir accounts back to their defaults (manager123 / guard123). Any employees or attendance you've already entered are kept.
                </div>
                <div style={{ display: "flex", gap: 8 }}>
                  <button type="button" onClick={() => setConfirmingReset(false)} style={{ flex: 1, background: "#fff", border: `1px solid ${C.line}`, borderRadius: 6, padding: "6px 10px", fontSize: 12.5, cursor: "pointer" }}>Cancel</button>
                  <button type="button" onClick={async () => { await onResetAccounts(); setConfirmingReset(false); setUsername("shihabuddin"); setPassword("manager123"); }} style={{ flex: 1, background: C.amberDeep, color: "#fff", border: "none", borderRadius: 6, padding: "6px 10px", fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>Reset Accounts</button>
                </div>
              </div>
            )}
          </div>

          <div style={{ marginTop: 10, textAlign: "center" }}>
            {fbJustConnected ? (
              <div style={{ background: "#EAF4EC", border: `1px solid #BFE0C9`, borderRadius: 8, padding: "10px 12px", textAlign: "left" }}>
                <div style={{ fontSize: 12.5, color: C.greenDeep, marginBottom: 8 }}>Connected. Reload this page for it to take effect.</div>
                <Btn full size="sm" tone="green" icon={RefreshCw} onClick={() => window.location.reload()}>Reload Now</Btn>
              </div>
            ) : !showFbConnect ? (
              <button type="button" onClick={() => setShowFbConnect(true)} style={{ background: "none", border: "none", color: C.ink50, fontSize: 12, textDecoration: "underline", cursor: "pointer" }}>
                {alreadyConnected ? "Change shared database connection" : "Guard or manager on a new phone? Connect to the shared database"}
              </button>
            ) : (
              <div style={{ background: "#F3F6FA", border: `1px solid ${C.line}`, borderRadius: 8, padding: "12px", textAlign: "left" }}>
                <div style={{ fontSize: 12.5, color: C.ink, marginBottom: 10, lineHeight: 1.5 }}>
                  This connects <i>this device</i> to the same shared data everyone else uses. Ask your admin for the
                  connection code — this is separate from your username and password.
                </div>
                <FirebaseConnectPanel onConnected={() => setFbJustConnected(true)} />
                <button type="button" onClick={() => setShowFbConnect(false)} style={{ background: "none", border: "none", color: C.ink50, fontSize: 11.5, marginTop: 10, cursor: "pointer", textDecoration: "underline" }}>Cancel</button>
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}
