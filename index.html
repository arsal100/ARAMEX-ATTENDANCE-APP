/* ---------------------------------------------------------------------
   INVENTORY — goods in/out through the chamber (tea, sugar, tags,
   wrapping materials, etc.), with a per-item reorder threshold so low
   stock surfaces on the dashboard instead of being discovered too late.
--------------------------------------------------------------------- */
function InventoryScreen({ session, stockItems, stockMovements, persistStockItems, persistStockMovements, notify }) {
  const [tab, setTab] = useState("items");
  const [showItemForm, setShowItemForm] = useState(false);
  const [showMoveForm, setShowMoveForm] = useState(null); // null | {item, type}
  const [editingItem, setEditingItem] = useState(null);

  const activeItems = stockItems.filter((i) => i.active);
  const withLevels = activeItems.map((i) => ({ ...i, level: stockLevel(i.id, stockMovements) }));
  const lowStock = withLevels.filter((i) => i.level <= i.min_threshold);
  const recentMoves = useMemo(() => [...stockMovements].sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time)).slice(0, 50), [stockMovements]);
  const itemById = useMemo(() => Object.fromEntries(stockItems.map((i) => [i.id, i])), [stockItems]);

  const addItem = async (data) => {
    await persistStockItems([{ id: uid("si_"), ...data, active: true, created_at: Date.now() }, ...stockItems]);
    notify(`${data.name} added`);
    setShowItemForm(false);
  };
  const saveItem = async (data) => {
    await persistStockItems(stockItems.map((i) => (i.id === editingItem.id ? { ...i, ...data } : i)));
    notify("Item updated");
    setEditingItem(null);
  };
  const toggleItemActive = async (item) => {
    await persistStockItems(stockItems.map((i) => (i.id === item.id ? { ...i, active: !i.active } : i)));
  };
  const logMovement = async (data) => {
    const now = new Date();
    const rec = { id: uid("sm_"), ...data, date: todayStr(now), time: nowTimeStr(now), recorded_by: session.name, created_at: Date.now() };
    await persistStockMovements([rec, ...stockMovements]);
    notify(`${data.type === "IN" ? "Stock in" : "Stock out"} recorded`);
    setShowMoveForm(null);
  };

  return (
    <div>
      <SectionTitle title="Inventory" sub={`${activeItems.length} item(s) tracked${lowStock.length ? ` · ${lowStock.length} low` : ""}`}
        action={session.role === "admin" ? { label: "+ Add Item", onClick: () => setShowItemForm(true) } : undefined} />

      {lowStock.length > 0 && (
        <div style={{ background: "#F7E7E5", border: `1px solid #E9C3BE`, borderRadius: 10, padding: "12px 14px", marginBottom: 16 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
            <AlertTriangle size={16} color={C.redDeep} />
            <span style={{ fontWeight: 700, fontSize: 13.5, color: C.redDeep }}>Low stock — reorder needed</span>
          </div>
          {lowStock.map((i) => (
            <div key={i.id} style={{ fontSize: 12.5, color: C.redDeep, padding: "2px 0" }}>
              {i.name}: {i.level} {i.unit} left (minimum {i.min_threshold})
            </div>
          ))}
        </div>
      )}

      <div style={{ display: "flex", gap: 6, marginBottom: 12 }}>
        {[["items", "Items"], ["history", "Movement History"]].map(([k, label]) => (
          <button key={k} onClick={() => setTab(k)} style={{
            padding: "7px 12px", borderRadius: 20, fontSize: 12.5, fontWeight: 600, cursor: "pointer",
            border: `1px solid ${tab === k ? C.navy : C.line}`, background: tab === k ? C.navy : "#fff", color: tab === k ? "#fff" : C.ink,
          }}>{label}</button>
        ))}
      </div>

      {tab === "items" ? (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {withLevels.length === 0 ? <EmptyState icon={Package} title="No inventory items yet" sub={session.role === "admin" ? "Tap + Add Item to start tracking stock" : "Ask admin to add items to track"} /> : (
            withLevels.sort((a, b) => (a.level <= a.min_threshold ? -1 : 1) - (b.level <= b.min_threshold ? -1 : 1)).map((i) => (
              <div key={i.id} style={{ background: "#fff", border: `1px solid ${i.level <= i.min_threshold ? "#E9C3BE" : C.line}`, borderRadius: 10, padding: "12px 14px" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8 }}>
                  <div>
                    <div style={{ display: "flex", alignItems: "center", gap: 7 }}>
                      <span style={{ fontWeight: 600, fontSize: 14.5, color: C.ink }}>{i.name}</span>
                      {i.level <= i.min_threshold && <Badge tone="missing">LOW STOCK</Badge>}
                    </div>
                    <div style={{ fontSize: 13, color: C.ink50, marginTop: 3 }}>
                      <span style={{ fontFamily: FONT_MONO, color: C.ink, fontWeight: 600 }}>{i.level} {i.unit}</span> on hand · minimum {i.min_threshold} {i.unit}
                    </div>
                  </div>
                  {session.role === "admin" && (
                    <button onClick={() => setEditingItem(i)} style={{ background: "none", border: "none", color: C.navy, cursor: "pointer" }}><Edit3 size={15} /></button>
                  )}
                </div>
                <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
                  <Btn size="sm" tone="green" icon={DoorOpen} onClick={() => setShowMoveForm({ item: i, type: "IN" })}>Stock In</Btn>
                  <Btn size="sm" tone="red" icon={DoorClosed} onClick={() => setShowMoveForm({ item: i, type: "OUT" })}>Stock Out</Btn>
                </div>
              </div>
            ))
          )}
        </div>
      ) : (
        <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, overflow: "hidden" }}>
          {recentMoves.length === 0 ? <EmptyState icon={ClipboardList} title="No movements recorded yet" /> : (
            <TableScroll headers={["Date", "Item", "Type", "Qty", "Person", "Company", "Recorded By"]}>
              {recentMoves.map((m) => {
                const item = itemById[m.item_id];
                return (
                  <tr key={m.id}>
                    <Td>{m.date} {fmtTime(m.time)}</Td>
                    <Td>{item ? item.name : "—"}</Td>
                    <Td><Badge tone={m.type === "IN" ? "inside" : "out"}>{m.type}</Badge></Td>
                    <Td>{m.quantity} {item ? item.unit : ""}</Td>
                    <Td>{m.person_name || "—"}{m.phone ? ` · ${m.phone}` : ""}</Td>
                    <Td>{m.company || "—"}</Td>
                    <Td>{m.recorded_by}</Td>
                  </tr>
                );
              })}
            </TableScroll>
          )}
        </div>
      )}

      {showItemForm && <StockItemForm onClose={() => setShowItemForm(false)} onSave={addItem} />}
      {editingItem && (
        <StockItemForm item={editingItem} onClose={() => setEditingItem(null)} onSave={saveItem}
          onToggleActive={() => { toggleItemActive(editingItem); setEditingItem(null); }} />
      )}
      {showMoveForm && (
        <StockMovementForm item={showMoveForm.item} type={showMoveForm.type} onClose={() => setShowMoveForm(null)} onSave={logMovement} />
      )}
    </div>
  );
}

function StockItemForm({ item, onClose, onSave, onToggleActive }) {
  const isNew = !item;
  const [name, setName] = useState(item?.name || "");
  const [unit, setUnit] = useState(item?.unit || "pcs");
  const [minThreshold, setMinThreshold] = useState(item?.min_threshold ?? 5);

  const save = () => {
    if (!name.trim()) return;
    onSave({ name: name.trim(), unit: unit.trim() || "pcs", min_threshold: Number(minThreshold) || 0 });
  };

  return (
    <Modal title={isNew ? "Add Inventory Item" : "Edit Inventory Item"} onClose={onClose}>
      <Field label="Item Name"><input autoFocus style={inputStyle} value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g. Tea, Shipping Tags" /></Field>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
        <Field label="Unit"><input style={inputStyle} value={unit} onChange={(e) => setUnit(e.target.value)} placeholder="boxes, kg, rolls…" /></Field>
        <Field label="Reorder Threshold"><input type="number" min="0" style={inputStyle} value={minThreshold} onChange={(e) => setMinThreshold(e.target.value)} /></Field>
      </div>
      <p style={{ fontSize: 12, color: C.ink50, marginTop: -4, marginBottom: 14 }}>You'll get a low-stock warning once the item's quantity on hand falls to or below this number.</p>
      <Btn full tone="navy" onClick={save} disabled={!name.trim()}>{isNew ? "Add Item" : "Save Changes"}</Btn>
      {!isNew && (
        <div style={{ marginTop: 10 }}>
          <Btn full tone={item.active ? "red" : "green"} onClick={onToggleActive}>{item.active ? "Deactivate Item" : "Reactivate Item"}</Btn>
        </div>
      )}
    </Modal>
  );
}

function StockMovementForm({ item, type, onClose, onSave }) {
  const [quantity, setQuantity] = useState("");
  const [personName, setPersonName] = useState("");
  const [phone, setPhone] = useState("");
  const [company, setCompany] = useState("");
  const [idCard, setIdCard] = useState("");
  const [remarks, setRemarks] = useState("");

  const save = () => {
    const q = Number(quantity);
    if (!q || q <= 0) return;
    onSave({ item_id: item.id, type, quantity: q, person_name: personName.trim(), phone: phone.trim(), company: company.trim(), id_card_number: idCard.trim(), remarks: remarks.trim() });
  };

  return (
    <Modal title={`${type === "IN" ? "Stock In" : "Stock Out"} — ${item.name}`} onClose={onClose}>
      <Field label={`Quantity (${item.unit})`}>
        <input autoFocus type="number" min="1" style={inputStyle} value={quantity} onChange={(e) => setQuantity(e.target.value)} />
      </Field>
      <Field label={type === "IN" ? "Delivered By (person's name)" : "Collected By (person's name)"}>
        <input style={inputStyle} value={personName} onChange={(e) => setPersonName(e.target.value)} />
      </Field>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
        <Field label="Phone (optional)"><input style={inputStyle} value={phone} onChange={(e) => setPhone(e.target.value)} /></Field>
        <Field label={type === "IN" ? "Company / Supplier" : "Department"}><input style={inputStyle} value={company} onChange={(e) => setCompany(e.target.value)} /></Field>
      </div>
      <Field label="ID / Card Number (optional)"><input style={inputStyle} value={idCard} onChange={(e) => setIdCard(e.target.value)} placeholder="whatever ID the gate records, if any" /></Field>
      <Field label="Remarks (optional)"><input style={inputStyle} value={remarks} onChange={(e) => setRemarks(e.target.value)} /></Field>
      <Btn full tone={type === "IN" ? "green" : "red"} onClick={save} disabled={!Number(quantity)}>Record {type === "IN" ? "Stock In" : "Stock Out"}</Btn>
    </Modal>
  );
}

/* ---------------------------------------------------------------------
   SHIFT HANDOVER / TAKEOVER
   The outgoing guard checks off every piece of equipment and pass count
   on the post, then the incoming guard reviews and formally takes over.
   Anything missing is flagged immediately and can be emailed straight to
   a manager rather than waiting for a scheduled report.
--------------------------------------------------------------------- */
function HandoverScreen({ session, users, handoverItems, handoverRecords, persistHandoverItems, persistHandoverRecords, settings, persistSettings, notify }) {
  const [tab, setTab] = useState("current");
  const [showStart, setShowStart] = useState(false);
  const [takingOver, setTakingOver] = useState(null);
  const [managingItems, setManagingItems] = useState(false);

  const pending = handoverRecords.find((r) => r.status === "PENDING");
  const activeItems = handoverItems.filter((i) => i.active);
  const history = useMemo(() => [...handoverRecords].filter((r) => r.status === "COMPLETED").sort((a, b) => (b.date + b.time_out).localeCompare(a.date + a.time_out)), [handoverRecords]);

  const startHandover = async (data) => {
    const now = new Date();
    const missing = data.items.filter((it) => !handoverItemOk(it));
    const rec = {
      id: uid("ho_"), date: todayStr(now), time_out: nowTimeStr(now), time_in: null,
      outgoing_guard: session.name, incoming_guard_expected: data.incoming_guard_expected, incoming_guard_confirmed: null,
      status: "PENDING", items: data.items, remarks_out: data.remarks, remarks_in: "",
      created_at: Date.now(), updated_at: Date.now(),
    };
    await persistHandoverRecords([rec, ...handoverRecords]);
    setShowStart(false);
    notify("Handover submitted — waiting for the next guard to take over");
    if (missing.length > 0) notify(`${missing.length} item(s) flagged as missing or short`, "error");
  };

  const completeTakeover = async (remarksIn, updatedItems) => {
    const now = new Date();
    const updated = { ...pending, status: "COMPLETED", time_in: nowTimeStr(now), incoming_guard_confirmed: session.name, remarks_in: remarksIn, items: updatedItems, updated_at: Date.now() };
    await persistHandoverRecords(handoverRecords.map((r) => (r.id === pending.id ? updated : r)));
    setTakingOver(null);
    notify("Shift taken over");
  };

  const sendMissingAlert = async (record) => {
    const alert = settings.handover_alert || { recipient_name: "", recipient_email: "" };
    if (!alert.recipient_email) { notify("Add a manager's email in Settings → Handover Alerts first", "error"); return; }
    const missing = record.items.filter((it) => !handoverItemOk(it));
    const subject = `Gate Handover — ${missing.length} item(s) missing or short (${record.date})`;
    const lines = [
      `Shift handover reported missing/short items.`, `Date: ${fmtDate(record.date)}`, `Outgoing guard: ${record.outgoing_guard}`,
      `Incoming guard: ${record.incoming_guard_confirmed || record.incoming_guard_expected}`, "", "Missing / short:",
      ...missing.map((it) => it.type === "quantity" ? `- ${it.name}: ${it.actual_quantity ?? 0} / ${it.expected_quantity} expected` : `- ${it.name}: missing`),
      "", record.remarks_out ? `Outgoing notes: ${record.remarks_out}` : "", record.remarks_in ? `Incoming notes: ${record.remarks_in}` : "",
      "", "Sent from the Aramex Gatehouse Register app.",
    ].filter(Boolean);
    const mailto = `mailto:${encodeURIComponent(alert.recipient_email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(lines.join("\n"))}`;
    const a = document.createElement("a"); a.href = mailto; a.target = "_blank";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    notify("Alert ready — check your email app");
  };

  return (
    <div>
      <SectionTitle title="Shift Handover" sub={pending ? "A handover is waiting to be taken over" : "No handover currently pending"}
        action={session.role === "admin" ? { label: "Manage Checklist", onClick: () => setManagingItems(true) } : undefined} />

      <div style={{ display: "flex", gap: 6, marginBottom: 14 }}>
        {[["current", "Current"], ["history", "History"]].map(([k, label]) => (
          <button key={k} onClick={() => setTab(k)} style={{
            padding: "7px 12px", borderRadius: 20, fontSize: 12.5, fontWeight: 600, cursor: "pointer",
            border: `1px solid ${tab === k ? C.navy : C.line}`, background: tab === k ? C.navy : "#fff", color: tab === k ? "#fff" : C.ink,
          }}>{label}</button>
        ))}
      </div>

      {tab === "current" ? (
        <div>
          {pending ? (
            <div style={{ background: "#fff", border: `2px solid ${C.amber}`, borderRadius: 12, padding: 18, marginBottom: 16 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
                <RefreshCw size={17} color={C.amberDeep} />
                <span style={{ fontWeight: 700, fontSize: 14.5, color: C.amberDeep }}>Pending Takeover</span>
              </div>
              <div style={{ fontSize: 13, color: C.ink, marginBottom: 4 }}>Handed over by <b>{pending.outgoing_guard}</b> at {fmtTime(pending.time_out)}</div>
              <div style={{ fontSize: 13, color: C.ink50, marginBottom: 12 }}>Expected incoming guard: {pending.incoming_guard_expected}</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 4, marginBottom: 12 }}>
                {pending.items.map((it) => (
                  <div key={it.item_id} style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, padding: "3px 0", borderBottom: `1px dashed ${C.line}` }}>
                    <span>{it.name}</span>
                    {it.type === "quantity" ? (
                      <span style={{ fontFamily: FONT_MONO, color: handoverItemOk(it) ? C.greenDeep : C.redDeep, fontWeight: 600 }}>{it.actual_quantity ?? 0} / {it.expected_quantity}</span>
                    ) : (
                      <Badge tone={it.present ? "inside" : "missing"}>{it.present ? "OK" : "MISSING"}</Badge>
                    )}
                  </div>
                ))}
              </div>
              {pending.remarks_out && <div style={{ fontSize: 12.5, color: C.ink50, marginBottom: 12 }}>Notes from outgoing guard: {pending.remarks_out}</div>}
              {pending.items.some((it) => !handoverItemOk(it)) && (
                <div style={{ background: "#FEE2E2", color: C.redDeep, borderRadius: 8, padding: "9px 11px", fontSize: 12.5, marginBottom: 12, display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
                  <span>Some items are missing or short.</span>
                  <Btn size="sm" tone="red" onClick={() => sendMissingAlert(pending)}>Alert Manager</Btn>
                </div>
              )}
              <Btn full tone="amber" icon={RefreshCw} onClick={() => setTakingOver(pending)}>Take Over Shift</Btn>
            </div>
          ) : (
            <div style={{ marginBottom: 16 }}>
              <EmptyState icon={RefreshCw} title="No handover pending" sub="Starting a new handover below will post it for the next guard" />
            </div>
          )}

          <Btn full tone="navy" icon={DoorOpen} onClick={() => setShowStart(true)} disabled={!!pending}>
            {pending ? "Complete the pending takeover first" : "+ Start Handover (End of My Shift)"}
          </Btn>
        </div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {history.length === 0 ? <EmptyState icon={ClipboardList} title="No completed handovers yet" /> : (
            history.map((r) => {
              const missing = r.items.filter((it) => !handoverItemOk(it));
              return (
                <div key={r.id} style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, padding: "12px 14px" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
                    <span style={{ fontWeight: 600, fontSize: 13.5 }}>{fmtDate(r.date)}</span>
                    {missing.length > 0 ? <Badge tone="missing">{missing.length} ISSUE(S)</Badge> : <Badge tone="inside">ALL CLEAR</Badge>}
                  </div>
                  <div style={{ fontSize: 12.5, color: C.ink50 }}>{r.outgoing_guard} → {r.incoming_guard_confirmed} · {fmtTime(r.time_out)} to {fmtTime(r.time_in)}</div>
                  {missing.length > 0 && <div style={{ fontSize: 12, color: C.redDeep, marginTop: 4 }}>{missing.map((m) => m.name).join(", ")}</div>}
                </div>
              );
            })
          )}
        </div>
      )}

      {showStart && <HandoverForm items={activeItems} users={users} session={session} onClose={() => setShowStart(false)} onSave={startHandover} />}
      {takingOver && <TakeoverForm record={takingOver} onClose={() => setTakingOver(null)} onConfirm={completeTakeover} />}
      {managingItems && (
        <HandoverItemsManager items={handoverItems} persistItems={persistHandoverItems}
          settings={settings} persistSettings={persistSettings} notify={notify} onClose={() => setManagingItems(false)} />
      )}
    </div>
  );
}

function HandoverForm({ items, users, session, onClose, onSave }) {
  const [state, setState] = useState(() => Object.fromEntries(items.map((i) => [i.id, i.type === "check" ? true : i.expected_quantity])));
  const [incomingGuard, setIncomingGuard] = useState("");
  const [remarks, setRemarks] = useState("");

  const otherUsers = users.filter((u) => u.active && u.name !== session.name);

  const save = () => {
    if (!incomingGuard.trim()) return;
    const builtItems = items.map((i) => ({
      item_id: i.id, name: i.name, type: i.type,
      present: i.type === "check" ? !!state[i.id] : null,
      expected_quantity: i.expected_quantity,
      actual_quantity: i.type === "quantity" ? Number(state[i.id]) : null,
    }));
    onSave({ incoming_guard_expected: incomingGuard.trim(), remarks: remarks.trim(), items: builtItems });
  };

  return (
    <Modal title="Start Shift Handover" onClose={onClose} wide>
      <Field label="Incoming guard">
        <select style={inputStyle} value={incomingGuard} onChange={(e) => setIncomingGuard(e.target.value)}>
          <option value="">Select…</option>
          {otherUsers.map((u) => <option key={u.id} value={u.name}>{u.name}</option>)}
        </select>
      </Field>
      <div style={{ fontSize: 12.5, fontWeight: 600, color: C.ink50, margin: "6px 0" }}>CHECKLIST</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 14 }}>
        {items.map((i) => (
          <div key={i.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: C.paperDim, borderRadius: 8, padding: "9px 12px" }}>
            <span style={{ fontSize: 13.5 }}>{i.name}</span>
            {i.type === "check" ? (
              <label style={{ display: "flex", alignItems: "center", gap: 7, cursor: "pointer" }}>
                <input type="checkbox" checked={!!state[i.id]} onChange={(e) => setState((s) => ({ ...s, [i.id]: e.target.checked }))} />
                <span style={{ fontSize: 12.5, color: state[i.id] ? C.greenDeep : C.redDeep, fontWeight: 600 }}>{state[i.id] ? "Present" : "Missing"}</span>
              </label>
            ) : (
              <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                <input type="number" min="0" style={{ ...inputStyle, width: 72, padding: "6px 8px" }} value={state[i.id]} onChange={(e) => setState((s) => ({ ...s, [i.id]: e.target.value }))} />
                <span style={{ fontFamily: FONT_MONO, fontSize: 11.5, color: C.ink50 }}>/ {i.expected_quantity}</span>
              </div>
            )}
          </div>
        ))}
      </div>
      <Field label="Remarks (optional)"><input style={inputStyle} value={remarks} onChange={(e) => setRemarks(e.target.value)} /></Field>
      <Btn full tone="navy" onClick={save} disabled={!incomingGuard.trim()}>Submit Handover</Btn>
    </Modal>
  );
}

function TakeoverForm({ record, onClose, onConfirm }) {
  const [items, setItems] = useState(record.items);
  const [remarks, setRemarks] = useState("");

  const toggleCheck = (itemId) => setItems((list) => list.map((i) => (i.item_id === itemId ? { ...i, present: !i.present } : i)));
  const setQty = (itemId, val) => setItems((list) => list.map((i) => (i.item_id === itemId ? { ...i, actual_quantity: Number(val) } : i)));

  return (
    <Modal title="Take Over Shift" onClose={onClose} wide>
      <p style={{ fontSize: 12.5, color: C.ink50, marginTop: 0 }}>Review what the outgoing guard reported. Adjust anything that doesn't match what you actually find.</p>
      <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 14 }}>
        {items.map((i) => (
          <div key={i.item_id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: C.paperDim, borderRadius: 8, padding: "9px 12px" }}>
            <span style={{ fontSize: 13.5 }}>{i.name}</span>
            {i.type === "check" ? (
              <label style={{ display: "flex", alignItems: "center", gap: 7, cursor: "pointer" }}>
                <input type="checkbox" checked={!!i.present} onChange={() => toggleCheck(i.item_id)} />
                <span style={{ fontSize: 12.5, color: i.present ? C.greenDeep : C.redDeep, fontWeight: 600 }}>{i.present ? "Present" : "Missing"}</span>
              </label>
            ) : (
              <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                <input type="number" min="0" style={{ ...inputStyle, width: 72, padding: "6px 8px" }} value={i.actual_quantity ?? 0} onChange={(e) => setQty(i.item_id, e.target.value)} />
                <span style={{ fontFamily: FONT_MONO, fontSize: 11.5, color: C.ink50 }}>/ {i.expected_quantity}</span>
              </div>
            )}
          </div>
        ))}
      </div>
      <Field label="Your remarks (optional)"><input style={inputStyle} value={remarks} onChange={(e) => setRemarks(e.target.value)} /></Field>
      <Btn full tone="amber" onClick={() => onConfirm(remarks.trim(), items)}>Confirm Takeover</Btn>
    </Modal>
  );
}

function HandoverItemsManager({ items, persistItems, settings, persistSettings, notify, onClose }) {
  const [adding, setAdding] = useState(false);
  const [newName, setNewName] = useState("");
  const [newType, setNewType] = useState("check");
  const [newQty, setNewQty] = useState(10);
  const alert0 = settings.handover_alert || { recipient_name: "", recipient_email: "" };
  const [alertForm, setAlertForm] = useState(alert0);

  const addItem = async () => {
    if (!newName.trim()) return;
    await persistItems([{ id: uid("hi_"), name: newName.trim(), type: newType, expected_quantity: newType === "quantity" ? Number(newQty) || 0 : null, active: true, created_at: Date.now() }, ...items]);
    setNewName(""); setNewQty(10); setAdding(false);
    notify("Checklist item added");
  };
  const toggleActive = async (item) => {
    await persistItems(items.map((i) => (i.id === item.id ? { ...i, active: !i.active } : i)));
  };
  const saveAlert = async () => {
    if (alertForm.recipient_email && !alertForm.recipient_name) { notify("Add a name for the recipient too", "error"); return; }
    await persistSettings({ ...settings, handover_alert: alertForm });
    notify("Handover alert settings saved");
  };

  return (
    <Modal title="Manage Handover Checklist" onClose={onClose} wide>
      <div style={{ marginBottom: 18 }}>
        <div style={{ fontSize: 12.5, fontWeight: 700, marginBottom: 8 }}>Checklist Items</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 10 }}>
          {items.map((i) => (
            <div key={i.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: C.paperDim, borderRadius: 7, padding: "7px 10px" }}>
              <span style={{ fontSize: 13, opacity: i.active ? 1 : 0.5 }}>{i.name} {i.type === "quantity" ? `(expect ${i.expected_quantity})` : ""}{!i.active ? " — inactive" : ""}</span>
              <button onClick={() => toggleActive(i)} style={{ background: "none", border: `1px solid ${C.line}`, borderRadius: 6, padding: "3px 8px", fontSize: 11, cursor: "pointer" }}>{i.active ? "Remove" : "Restore"}</button>
            </div>
          ))}
        </div>
        {!adding ? (
          <Btn size="sm" tone="paper" icon={UserPlus} onClick={() => setAdding(true)}>Add Item</Btn>
        ) : (
          <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 8, padding: 10 }}>
            <Field label="Item name"><input style={inputStyle} value={newName} onChange={(e) => setNewName(e.target.value)} placeholder="e.g. Torch, Radio" /></Field>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
              <Field label="Type">
                <select style={inputStyle} value={newType} onChange={(e) => setNewType(e.target.value)}>
                  <option value="check">Checkbox (present/missing)</option>
                  <option value="quantity">Quantity (count)</option>
                </select>
              </Field>
              {newType === "quantity" && <Field label="Expected quantity"><input type="number" min="0" style={inputStyle} value={newQty} onChange={(e) => setNewQty(e.target.value)} /></Field>}
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <Btn size="sm" tone="ghost" onClick={() => setAdding(false)}>Cancel</Btn>
              <Btn size="sm" tone="navy" onClick={addItem} disabled={!newName.trim()}>Add</Btn>
            </div>
          </div>
        )}
      </div>

      <div style={{ borderTop: `1px dashed ${C.line}`, paddingTop: 14 }}>
        <div style={{ fontSize: 12.5, fontWeight: 700, marginBottom: 8 }}>Handover Alert Email</div>
        <p style={{ fontSize: 12, color: C.ink50, margin: "0 0 10px" }}>Who gets notified immediately when a handover has missing or short items.</p>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
          <Field label="Manager's name"><input style={inputStyle} value={alertForm.recipient_name} onChange={(e) => setAlertForm((f) => ({ ...f, recipient_name: e.target.value }))} /></Field>
          <Field label="Manager's email"><input type="email" style={inputStyle} value={alertForm.recipient_email} onChange={(e) => setAlertForm((f) => ({ ...f, recipient_email: e.target.value }))} /></Field>
        </div>
        <Btn size="sm" tone="navy" onClick={saveAlert}>Save</Btn>
      </div>
    </Modal>
  );
}

/* ---------------------------------------------------------------------
   INCIDENT REPORTS
   Anything out of the ordinary at the gate — theft, fire, altercation,
   safety hazard, trespassing, and so on — with severity levels and an
   immediate manager alert for anything serious, separate from the
   scheduled reports.
--------------------------------------------------------------------- */
const INCIDENT_TYPES = ["Theft", "Fire", "Altercation / Dispute", "Safety Hazard", "Trespassing", "Medical Emergency", "Property Damage", "Suspicious Activity", "Other"];
const INCIDENT_SEVERITIES = ["Low", "Medium", "High", "Critical"];
const INCIDENT_STATUSES = ["Open", "Under Investigation", "Resolved", "Closed"];

function severityTone(sev) {
  if (sev === "Critical" || sev === "High") return "missing";
  if (sev === "Medium") return "overtime";
  return "neutral";
}

function IncidentsScreen({ session, incidents, persistIncidents, settings, persistSettings, notify }) {
  const [tab, setTab] = useState("open");
  const [showForm, setShowForm] = useState(false);
  const [viewing, setViewing] = useState(null);
  const [alertSettings, setAlertSettings] = useState(false);

  const sorted = useMemo(() => [...incidents].sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time)), [incidents]);
  const open = sorted.filter((i) => i.status === "Open" || i.status === "Under Investigation");
  const list = tab === "open" ? open : sorted;

  const report = async (data) => {
    const now = new Date();
    const rec = {
      id: uid("inc_"), date: todayStr(now), time: nowTimeStr(now), ...data,
      status: "Open", reported_by: session.name, resolved_by: null, resolution_notes: "",
      created_at: Date.now(), updated_at: Date.now(),
    };
    await persistIncidents([rec, ...incidents]);
    setShowForm(false);
    notify("Incident reported");
  };

  const updateStatus = async (incident, status, resolutionNotes) => {
    const updated = {
      ...incident, status, updated_at: Date.now(),
      resolution_notes: resolutionNotes != null ? resolutionNotes : incident.resolution_notes,
      resolved_by: (status === "Resolved" || status === "Closed") ? session.name : incident.resolved_by,
    };
    await persistIncidents(incidents.map((i) => (i.id === incident.id ? updated : i)));
    setViewing(updated);
    notify("Incident updated");
  };

  const sendAlert = async (incident) => {
    const alert = settings.incident_alert || { recipient_name: "", recipient_email: "" };
    if (!alert.recipient_email) { notify("Add a manager's email in Alert Settings first", "error"); return; }
    const subject = `[${incident.severity.toUpperCase()}] Incident: ${incident.type} — ${fmtDate(incident.date)}`;
    const lines = [
      `Incident Report`, `Type: ${incident.type}`, `Severity: ${incident.severity}`, `Date/Time: ${fmtDate(incident.date)} ${fmtTime(incident.time)}`,
      `Location: ${incident.location || "—"}`, `Reported by: ${incident.reported_by}`, "",
      `Description:`, incident.description || "—", "",
      incident.people_involved ? `People involved: ${incident.people_involved}` : "",
      incident.action_taken ? `Action taken: ${incident.action_taken}` : "",
      "", "Sent from the Aramex Gatehouse Register app.",
    ].filter(Boolean);
    const mailto = `mailto:${encodeURIComponent(alert.recipient_email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(lines.join("\n"))}`;
    const a = document.createElement("a"); a.href = mailto; a.target = "_blank";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    notify("Alert ready — check your email app");
  };

  return (
    <div>
      <SectionTitle title="Incident Reports" sub={`${open.length} open`} action={{ label: "+ Report Incident", onClick: () => setShowForm(true) }} />
      {session.role === "admin" && (
        <button onClick={() => setAlertSettings(true)} style={{ background: "none", border: "none", color: C.navy, fontSize: 12, fontWeight: 600, cursor: "pointer", textDecoration: "underline", marginBottom: 12, display: "block" }}>
          Alert Settings
        </button>
      )}

      <div style={{ display: "flex", gap: 6, marginBottom: 12 }}>
        {[["open", `Open (${open.length})`], ["all", "All"]].map(([k, label]) => (
          <button key={k} onClick={() => setTab(k)} style={{
            padding: "7px 12px", borderRadius: 20, fontSize: 12.5, fontWeight: 600, cursor: "pointer",
            border: `1px solid ${tab === k ? C.navy : C.line}`, background: tab === k ? C.navy : "#fff", color: tab === k ? "#fff" : C.ink,
          }}>{label}</button>
        ))}
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {list.length === 0 ? <EmptyState icon={AlertTriangle} title={tab === "open" ? "No open incidents" : "No incidents reported yet"} /> : (
          list.map((i) => (
            <button key={i.id} onClick={() => setViewing(i)} style={{ textAlign: "left", background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, padding: "12px 14px", cursor: "pointer" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8 }}>
                <div style={{ minWidth: 0 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 7, flexWrap: "wrap" }}>
                    <span style={{ fontWeight: 600, fontSize: 14, color: C.ink }}>{i.type}</span>
                    <Badge tone={severityTone(i.severity)}>{i.severity.toUpperCase()}</Badge>
                    <Badge tone="neutral">{i.status.toUpperCase()}</Badge>
                  </div>
                  <div style={{ fontSize: 12.5, color: C.ink50, marginTop: 3 }}>{i.location || "—"} · {fmtDate(i.date)} {fmtTime(i.time)}</div>
                  <div style={{ fontSize: 12.5, color: C.ink, marginTop: 4 }}>{i.description}</div>
                  <div style={{ fontSize: 11.5, color: C.ink50, marginTop: 4 }}>Reported by {i.reported_by}</div>
                </div>
                <ChevronRight size={16} color={C.ink50} style={{ flexShrink: 0 }} />
              </div>
            </button>
          ))
        )}
      </div>

      {showForm && <IncidentForm onClose={() => setShowForm(false)} onSave={report} />}
      {viewing && (
        <IncidentDetailModal incident={viewing} onClose={() => setViewing(null)} onUpdateStatus={updateStatus} onAlert={sendAlert} />
      )}
      {alertSettings && (
        <IncidentAlertSettings settings={settings} persistSettings={persistSettings} notify={notify} onClose={() => setAlertSettings(false)} />
      )}
    </div>
  );
}

function IncidentForm({ onClose, onSave }) {
  const [type, setType] = useState(INCIDENT_TYPES[0]);
  const [severity, setSeverity] = useState("Low");
  const [location, setLocation] = useState("");
  const [description, setDescription] = useState("");
  const [peopleInvolved, setPeopleInvolved] = useState("");
  const [actionTaken, setActionTaken] = useState("");

  const save = () => {
    if (!description.trim()) return;
    onSave({ type, severity, location: location.trim(), description: description.trim(), people_involved: peopleInvolved.trim(), action_taken: actionTaken.trim() });
  };

  return (
    <Modal title="Report Incident" onClose={onClose} wide>
      <Field label="Type">
        <select style={inputStyle} value={type} onChange={(e) => setType(e.target.value)}>
          {INCIDENT_TYPES.map((t) => <option key={t} value={t}>{t}</option>)}
        </select>
      </Field>
      <Field label="Severity">
        <div style={{ display: "flex", gap: 6 }}>
          {INCIDENT_SEVERITIES.map((s) => (
            <button key={s} type="button" onClick={() => setSeverity(s)} style={{
              flex: 1, padding: "8px 6px", borderRadius: 8, fontSize: 12.5, fontWeight: 600, cursor: "pointer",
              border: `1px solid ${severity === s ? C.navy : C.line}`, background: severity === s ? C.navy : "#fff", color: severity === s ? "#fff" : C.ink,
            }}>{s}</button>
          ))}
        </div>
      </Field>
      <Field label="Location"><input style={inputStyle} value={location} onChange={(e) => setLocation(e.target.value)} placeholder="e.g. Main Gate, Loading Bay 2" /></Field>
      <Field label="Description"><textarea style={{ ...inputStyle, minHeight: 80 }} value={description} onChange={(e) => setDescription(e.target.value)} placeholder="What happened?" /></Field>
      <Field label="People Involved (optional)"><input style={inputStyle} value={peopleInvolved} onChange={(e) => setPeopleInvolved(e.target.value)} /></Field>
      <Field label="Immediate Action Taken (optional)"><input style={inputStyle} value={actionTaken} onChange={(e) => setActionTaken(e.target.value)} /></Field>
      <Btn full tone="red" icon={AlertTriangle} onClick={save} disabled={!description.trim()}>Submit Report</Btn>
    </Modal>
  );
}

function LeaveScreen({ session, employees, empById, leaves, persistLeaves, notify }) {
  const [showForm, setShowForm] = useState(false);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const today = todayStr();

  const sorted = useMemo(() => [...leaves].sort((a, b) => b.date_from.localeCompare(a.date_from)), [leaves]);
  const current = sorted.filter((l) => l.date_to >= today);
  const past = sorted.filter((l) => l.date_to < today);

  const addLeave = async (data) => {
    const rec = { id: uid("lv_"), ...data, recorded_by: session.name, created_at: Date.now() };
    await persistLeaves([rec, ...leaves]);
    notify("Leave recorded");
    setShowForm(false);
  };

  const removeLeave = async (id) => {
    await persistLeaves(leaves.filter((l) => l.id !== id));
    notify("Leave entry removed");
    setConfirmDelete(null);
  };

  const LeaveRow = ({ l, removable }) => {
    const e = empById[l.employee_id];
    if (!e) return null;
    const range = l.date_from === l.date_to ? fmtDate(l.date_from) : `${fmtDate(l.date_from)} – ${fmtDate(l.date_to)}`;
    return (
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "11px 14px", borderBottom: `1px solid ${C.line}` }}>
        <div style={{ minWidth: 0 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
            <span style={{ fontWeight: 600, fontSize: 14 }}>{e.name}</span>
            <Badge tone={l.type === "Sick Leave" || l.type === "Absent" ? "missing" : "neutral"}>{l.type.toUpperCase()}</Badge>
          </div>
          <div style={{ fontSize: 12, color: C.ink50, marginTop: 2 }}>
            {range}{l.reason ? ` — ${l.reason}` : ""} · recorded by {l.recorded_by}
          </div>
        </div>
        {removable && session.role === "admin" && (
          <button onClick={() => setConfirmDelete(l)} style={{ background: "none", border: "none", color: C.redDeep, cursor: "pointer", flexShrink: 0 }}><Trash2 size={15} /></button>
        )}
      </div>
    );
  };

  return (
    <div>
      <SectionTitle title="Leave & Absences" sub={`${current.length} current or upcoming`} action={{ label: "+ Mark Leave", onClick: () => setShowForm(true) }} />

      <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, overflow: "hidden", marginBottom: 20 }}>
        {current.length === 0 ? <EmptyState icon={UserX} title="No one is currently marked on leave" /> : current.map((l) => <LeaveRow key={l.id} l={l} removable />)}
      </div>

      {past.length > 0 && (
        <>
          <SectionTitle title="Past Leave" />
          <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, overflow: "hidden" }}>
            {past.slice(0, 30).map((l) => <LeaveRow key={l.id} l={l} removable />)}
          </div>
        </>
      )}

      {showForm && <LeaveForm employees={employees} onClose={() => setShowForm(false)} onSave={addLeave} />}

      {confirmDelete && (
        <Modal title="Remove Leave Entry" onClose={() => setConfirmDelete(null)}>
          <p style={{ fontSize: 14, color: C.ink, lineHeight: 1.5 }}>
            Remove this leave entry for <b>{empById[confirmDelete.employee_id]?.name}</b>?
          </p>
          <div style={{ display: "flex", gap: 8 }}>
            <Btn tone="ghost" onClick={() => setConfirmDelete(null)}>Cancel</Btn>
            <Btn tone="red" onClick={() => removeLeave(confirmDelete.id)}>Remove</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

function LeaveForm({ employees, onClose, onSave }) {
  const [selected, setSelected] = useState(null);
  const [type, setType] = useState("Annual Leave");
  const [dateFrom, setDateFrom] = useState(todayStr());

  return (
    <Modal title="Mark Employee on Leave" onClose={onClose}>

            <div>
              <div style={{ fontFamily: FONT_SERIF, fontSize: 17, color: C.ink }}>{selected.name}</div>
              <div style={{ fontFamily: FONT_MONO, fontSize: 12, color: C.navy }}>{selected.employee_number}</div>
            </div>
            <button onClick={() => setSelected(null)} style={{ background: "none", border: "none", color: C.ink50, cursor: "pointer" }}><X size={18} /></button>

            </select>
          </Field>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
            <Field label="From"><input type="date" style={inputStyle} value={dateFrom} onChange={(e) => setDateFrom(e.target.value)} /></Field>
            <Field label="To"><input type="date" style={inputStyle} value={dateTo} onChange={(e) => setDateTo(e.target.value)} /></Field>

        </div>
      )}

}

/* ---------------------------------------------------------------------
   EMPLOYEES (admin)
--------------------------------------------------------------------- */
function EmployeesScreen({ employees, persistEmployees, notify }) {
  const [q, setQ] = useState("");
  const [statusFilter, setStatusFilter] = useState("active");
  const [editing, setEditing] = useState(null); // employee or {} for new
  const [confirmDeactivate, setConfirmDeactivate] = useState(null);
  const [bulkOpen, setBulkOpen] = useState(false);

  const filtered = employees.filter((e) => {
    if (statusFilter === "active" && !e.active) return false;
    if (statusFilter === "inactive" && e.active) return false;
    if (!q.trim()) return true;
    const t = q.toLowerCase();
    return e.name.toLowerCase().includes(t) || e.employee_number.toLowerCase().includes(t) || e.company.toLowerCase().includes(t) || e.department.toLowerCase().includes(t);
  });

  const save = async (data) => {
    if (!data.employee_number.trim() || !data.name.trim()) { notify("Employee ID and name are required", "error"); return; }
    const dupe = employees.find((e) => e.employee_number.trim().toLowerCase() === data.employee_number.trim().toLowerCase() && e.id !== data.id);
    if (dupe) { notify("That Employee ID is already in use", "error"); return; }
    let next;
    if (data.id) {
      next = employees.map((e) => (e.id === data.id ? { ...e, ...data, updated_at: Date.now() } : e));
      notify("Employee updated");
    } else {
      next = [{ ...data, id: uid("e_"), active: true, created_at: Date.now(), updated_at: Date.now() }, ...employees];
      notify("Employee added");
    }
    await persistEmployees(next);
    setEditing(null);
  };

  const toggleActive = async (emp) => {
    const next = employees.map((e) => (e.id === emp.id ? { ...e, active: !e.active, updated_at: Date.now() } : e));
    await persistEmployees(next);
    notify(emp.active ? `${emp.name} deactivated` : `${emp.name} reactivated`);
    setConfirmDeactivate(null);
  };

  const demoCount = employees.filter((e) => e.demo).length;

  const removeDemo = async () => {
    await persistEmployees(employees.filter((e) => !e.demo));
    notify(`Removed ${demoCount} demo employee${demoCount === 1 ? "" : "s"}`);
  };

  return (
    <div>
      <SectionTitle title="Employee Management" sub={`${employees.filter((e) => e.active).length} active · ${employees.filter((e) => !e.active).length} inactive`}
        action={{ label: "+ Add employee", onClick: () => setEditing({}) }} />

      <div style={{ display: "flex", gap: 8, marginBottom: 12, flexWrap: "wrap" }}>
        <Btn size="sm" tone="paper" icon={UserPlus} onClick={() => setBulkOpen(true)}>Bulk add employees</Btn>
        {demoCount > 0 && <Btn size="sm" tone="ghost" icon={Trash2} onClick={removeDemo}>Remove {demoCount} demo employee{demoCount === 1 ? "" : "s"}</Btn>}
      </div>

      <div style={{ display: "flex", gap: 8, marginBottom: 12, flexWrap: "wrap" }}>
        <div style={{ position: "relative", flex: 1, minWidth: 180 }}>
          <Search size={15} style={{ position: "absolute", left: 10, top: 11, color: C.ink50 }} />
          <input style={{ ...inputStyle, paddingLeft: 32 }} placeholder="Search employees…" value={q} onChange={(e) => setQ(e.target.value)} />
        </div>
        <select style={{ ...inputStyle, width: "auto" }} value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)}>
          <option value="active">Active</option><option value="inactive">Inactive</option><option value="all">All</option>
        </select>
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {filtered.length === 0 && <EmptyState icon={Users} title="No employees found" />}
        {filtered.map((e) => (
          <div key={e.id} style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, padding: "12px 14px", display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10 }}>
            <div style={{ minWidth: 0 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ fontWeight: 600, fontSize: 14.5, color: C.ink }}>{e.name}</span>
                {!e.active && <Badge tone="missing">INACTIVE</Badge>}
                {e.demo && <Badge tone="neutral">DEMO</Badge>}
              </div>
              <div style={{ fontSize: 12.5, color: C.ink50, marginTop: 2 }}>
                <span style={{ fontFamily: FONT_MONO }}>{e.employee_number}</span> · {e.company} · {e.department} · {e.designation}
              </div>
            </div>
            <div style={{ display: "flex", gap: 6, flexShrink: 0 }}>
              <button onClick={() => setEditing(e)} style={{ background: C.paperDim, border: "none", borderRadius: 7, padding: 8, cursor: "pointer", color: C.navy }}><Edit3 size={15} /></button>
              <button onClick={() => setConfirmDeactivate(e)} style={{ background: e.active ? "#F7E7E5" : "#EAF4EC", border: "none", borderRadius: 7, padding: 8, cursor: "pointer", color: e.active ? C.redDeep : C.greenDeep }}>
                {e.active ? <Trash2 size={15} /> : <RefreshCw size={15} />}
              </button>
            </div>
          </div>
        ))}
      </div>

      {editing !== null && <EmployeeForm employee={editing} onClose={() => setEditing(null)} onSave={save} />}

      {bulkOpen && (
        <BulkAddModal employees={employees} onClose={() => setBulkOpen(false)}

        <Modal title={confirmDeactivate.active ? "Deactivate Employee" : "Reactivate Employee"} onClose={() => setConfirmDeactivate(null)}>
          <p style={{ fontSize: 14, color: C.ink, lineHeight: 1.5 }}>
            {confirmDeactivate.active
              ? <>Deactivate <b>{confirmDeactivate.name}</b>? They won't be checkable-in at the gate, but their attendance history is kept permanently.</>

  );
}

/* ---------------------------------------------------------------------
   BULK ADD EMPLOYEES
   Paste one employee per line so a full roster can be added in seconds
   instead of one at a time. Employee IDs are generated automatically.
--------------------------------------------------------------------- */
function nextEmployeeNumber(employees, offset) {
  let max = 1000;
  employees.forEach((e) => {
    const m = /(\d+)\s*$/.exec(e.employee_number || "");
    if (m) max = Math.max(max, parseInt(m[1], 10));
  });
  return `EMP-${max + offset}`;
}

function BulkAddModal({ employees, onClose, onAdd }) {
  const [raw, setRaw] = useState("");
  const [defCompany, setDefCompany] = useState("");
  const [defDept, setDefDept] = useState("");
  const [defDesignation, setDefDesignation] = useState("");

  const parsed = useMemo(() => {
    return raw.split("\n").map((line) => line.trim()).filter(Boolean).map((line) => {
      const parts = line.split(",").map((p) => p.trim());
      return {
        name: parts[0] || "",
        company: parts[1] || defCompany,
        department: parts[2] || defDept,
        designation: parts[3] || defDesignation,
        phone: parts[4] || "",
      };
    }).filter((p) => p.name);
  }, [raw, defCompany, defDept, defDesignation]);

  const existingNames = useMemo(() => new Set(employees.map((e) => e.name.trim().toLowerCase())), [employees]);
  const duplicateCount = parsed.filter((p) => existingNames.has(p.name.trim().toLowerCase())).length;

  const confirm = () => {
    if (parsed.length === 0) return;
    const created = parsed.map((p, i) => ({
      id: uid("e_"), employee_number: nextEmployeeNumber(employees, i + 1), name: p.name,
      company: p.company, department: p.department, designation: p.designation, phone: p.phone,
      active: true, created_at: Date.now(), updated_at: Date.now(),
    }));
    onAdd(created);
  };

  return (
    <Modal title="Bulk Add Employees" onClose={onClose} wide>
      <p style={{ fontSize: 12.5, color: C.ink50, marginTop: 0, lineHeight: 1.6 }}>
        Paste one employee per line. Each line can just be a name, or add more detail separated by commas:<br />
        <span style={{ fontFamily: FONT_MONO, fontSize: 11.5, background: C.paperDim, padding: "1px 5px", borderRadius: 4 }}>
          Name, Company, Department, Designation, Phone
        </span><br />
        Employee IDs are assigned automatically. Blank fields use the defaults below.
      </p>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, marginBottom: 12 }}>
        <Field label="Default company"><input style={inputStyle} value={defCompany} onChange={(e) => setDefCompany(e.target.value)} placeholder="optional" /></Field>
        <Field label="Default department"><input style={inputStyle} value={defDept} onChange={(e) => setDefDept(e.target.value)} placeholder="optional" /></Field>
        <Field label="Default designation"><input style={inputStyle} value={defDesignation} onChange={(e) => setDefDesignation(e.target.value)} placeholder="optional" /></Field>
      </div>

      <Field label="Employees (one per line)">
        <textarea
          style={{ ...inputStyle, minHeight: 160, fontFamily: FONT_MONO, fontSize: 13 }}
          value={raw}
          onChange={(e) => setRaw(e.target.value)}
          placeholder={"James Mwangi\nAlice Wanjiru, Northgate Logistics, Warehouse, Driver\nDavid Njoroge, Northgate Logistics, IT, Technician, 0712345678"}
        />
      </Field>

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14, fontSize: 12.5, color: C.ink50 }}>
        <span>{parsed.length} employee{parsed.length === 1 ? "" : "s"} ready to add</span>
        {duplicateCount > 0 && <span style={{ color: C.amberDeep }}>{duplicateCount} name{duplicateCount === 1 ? "" : "s"} match existing employees</span>}
      </div>

      {parsed.length > 0 && (
        <div style={{ maxHeight: 160, overflowY: "auto", border: `1px solid ${C.line}`, borderRadius: 8, marginBottom: 14 }}>
          {parsed.map((p, i) => (
            <div key={i} style={{ padding: "7px 10px", fontSize: 12.5, borderBottom: i < parsed.length - 1 ? `1px solid ${C.line}` : "none", display: "flex", justifyContent: "space-between" }}>
              <span style={{ fontWeight: 600 }}>{p.name}</span>
              <span style={{ color: C.ink50 }}>{[p.company, p.department, p.designation].filter(Boolean).join(" · ") || "—"}</span>
            </div>
          ))}
        </div>
      )}

      <Btn full tone="navy" icon={UserPlus} onClick={confirm} disabled={parsed.length === 0}>
        Add {parsed.length || ""} Employee{parsed.length === 1 ? "" : "s"}
      </Btn>
    </Modal>
  );
}

function PeriodReport({ mode, employees, attendance, empById, settings }) {
  const [date, setDate] = useState(todayStr());
  const [month, setMonth] = useState(todayStr().slice(0, 7));

  let from, to, label;
  if (mode === "daily") { from = to = date; label = fmtDate(date); }
  else if (mode === "weekly") {
    const start = startOfWeek(new Date(date + "T00:00:00"));
    const end = new Date(start); end.setDate(end.getDate() + 6);
    from = todayStr(start); to = todayStr(end); label = `${fmtDate(from)} – ${fmtDate(to)}`;
  } else {
    from = `${month}-01`;
    const [y, m] = month.split("-").map(Number);
    const last = new Date(y, m, 0).getDate();
    to = `${month}-${String(last).padStart(2, "0")}`;
    label = new Date(from + "T00:00:00").toLocaleDateString(undefined, { month: "long", year: "numeric" });
  }

  const shiftHours = settings.shift_hours || 9;
  const rows = attendance.filter((a) => a.date >= from && a.date <= to).map((a) => ({ ...a, emp: empById[a.employee_id] })).filter((r) => r.emp);
  rows.sort((a, b) => (b.date + b.time_in).localeCompare(a.date + a.time_in));
  const overtimeTotal = rows.reduce((s, r) => s + overtimeMinutes(r.total_minutes, shiftHours), 0);
  const overtimeCount = rows.filter((r) => overtimeMinutes(r.total_minutes, shiftHours) > 0).length;
  const missingCheckout = rows.filter((r) => r.status === "INSIDE" && r.date < todayStr()).length;
  const totalMinutes = rows.reduce((s, r) => s + (r.total_minutes || 0), 0);

  const headers = [
    { label: "Date", get: (r) => r.date }, { label: "Employee", get: (r) => r.emp.name }, { label: "Employee ID", get: (r) => r.emp.employee_number },
    { label: "Company", get: (r) => r.emp.company }, { label: "Time In", get: (r) => r.time_in }, { label: "Time Out", get: (r) => r.time_out || "" },
    { label: "Total Hours", get: (r) => r.total_minutes != null ? fmtDuration(r.total_minutes) : "" }, { label: "Status", get: (r) => r.status },
    { label: "Overtime", get: (r) => fmtDuration(overtimeMinutes(r.total_minutes, shiftHours)) }, { label: "Recorded By", get: (r) => r.status === "INSIDE" ? r.checked_in_by : r.checked_out_by },
  ];

  return (
    <div>
      <div style={{ display: "flex", gap: 10, alignItems: "flex-end", marginBottom: 14, flexWrap: "wrap" }}>
        {mode === "monthly" ? (
          <Field label="Month"><input type="month" style={inputStyle} value={month} onChange={(e) => setMonth(e.target.value)} /></Field>
        ) : (
          <Field label={mode === "weekly" ? "Any date in week" : "Date"}><input type="date" style={inputStyle} value={date} onChange={(e) => setDate(e.target.value)} /></Field>
        )}
        <Btn size="sm" tone="paper" icon={Download} onClick={() => downloadFile(`${mode}-report-${from}_${to}.csv`, toCSV(rows, headers), "text/csv")}>CSV</Btn>
        <Btn size="sm" tone="paper" icon={FileDown} onClick={() => window.print()}>PDF (Print)</Btn>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(120px,1fr))", gap: 10, marginBottom: 16 }}>
        <StatCard label="Period" value={label} icon={CalendarDays} tone="navy" />
        <StatCard label="Total Records" value={rows.length} icon={ClipboardList} tone="slate" />
        <StatCard label="Overtime Records" value={overtimeCount} icon={AlertTriangle} tone="amber" />
        <StatCard label="Total Overtime" value={fmtDuration(overtimeTotal)} icon={TimerReset} tone="amber" />
        <StatCard label="Missing Check-outs" value={missingCheckout} icon={XCircle} tone="red" />
        <StatCard label="Total Hours Logged" value={fmtDuration(totalMinutes)} icon={Clock} tone="green" />
      </div>

      <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, overflow: "hidden" }}>
        {rows.length === 0 ? <EmptyState icon={BarChart3} title="No attendance in this period" /> : (
          <TableScroll headers={["Date", "Employee", "ID", "Time In", "Time Out", "Hours", "Status"]}>
            {rows.map((r) => (
              <tr key={r.id}>
                <Td>{r.date}</Td><Td>{r.emp.name}</Td><TdMono>{r.emp.employee_number}</TdMono>
                <TdMono>{fmtTime(r.time_in)}</TdMono><TdMono>{r.time_out ? fmtTime(r.time_out) : "—"}</TdMono>
                <Td>{r.total_minutes != null ? fmtDuration(r.total_minutes) : "—"}</Td><Td><StatusBadge a={r} shiftHours={settings.shift_hours} /></Td>
              </tr>
            ))}
          </TableScroll>
        )}
      </div>
    </div>
  );
}

  const avgMinutes = totalDays ? Math.round(rows.filter(r=>r.total_minutes!=null).reduce((s,r)=>s+r.total_minutes,0) / Math.max(1, rows.filter(r=>r.total_minutes!=null).length)) : 0;
  const overtimeTotal = rows.reduce((s, r) => s + overtimeMinutes(r.total_minutes, shiftHours), 0);
  const overtimeCount = rows.filter((r) => overtimeMinutes(r.total_minutes, shiftHours) > 0).length;
  const missing = rows.filter((r) => r.status === "INSIDE" && r.date < todayStr()).length;

  const headers = [

            <StatCard label="Attendance Days" value={totalDays} icon={CalendarDays} tone="navy" />
            <StatCard label="Total Hours" value={fmtDuration(totalMinutes)} icon={Clock} tone="slate" />
            <StatCard label="Average Hours/Day" value={fmtDuration(avgMinutes)} icon={BarChart3} tone="green" />
            <StatCard label="Overtime Days" value={overtimeCount} icon={AlertTriangle} tone="amber" />
            <StatCard label="Total Overtime" value={fmtDuration(overtimeTotal)} icon={TimerReset} tone="amber" />
            <StatCard label="Missing Check-outs" value={missing} icon={XCircle} tone="red" />
          </div>
          <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, overflow: "hidden" }}>
            {rows.length === 0 ? <EmptyState icon={ClipboardList} title="No attendance history for this employee" /> : (
              <TableScroll headers={["Date", "Time In", "Time Out", "Hours", "Status"]}>
                {rows.slice().sort((a,b)=>b.date.localeCompare(a.date)).map((r) => (
                  <tr key={r.id}><Td>{r.date}</Td><TdMono>{fmtTime(r.time_in)}</TdMono><TdMono>{r.time_out ? fmtTime(r.time_out) : "—"}</TdMono>
                  <Td>{r.total_minutes != null ? fmtDuration(r.total_minutes) : "—"}</Td><Td><StatusBadge a={r} shiftHours={shiftHours} /></Td></tr>
                ))}
              </TableScroll>
            )}
          </div>
        </>
      )}
    </div>
  );
}

function SettingsScreen({ settings, persistSettings, users, persistUsers, notify, loadSample, eraseAll, busy, sendReport, syncMode, canWriteShared, firebaseError }) {
  const [shiftHours, setShiftHours] = useState(settings.shift_hours || 9);

  const [fbForm, setFbForm] = useState(savedFbConfig || { apiKey: "", authDomain: "", projectId: "", storageBucket: "", messagingSenderId: "", appId: "" });
  const [fbSaved, setFbSaved] = useState(false);

  const connectFirebase = () => {
    if (!fbForm.apiKey.trim() || !fbForm.authDomain.trim() || !fbForm.projectId.trim() || !fbForm.appId.trim()) {
      notify("API Key, Auth Domain, Project ID, and App ID are all required", "error"); return;
    }
    saveFirebaseConfig(fbForm);
    setFbSaved(true);
  };
  const disconnectFirebase = () => {
    clearFirebaseConfig();
    setFbForm({ apiKey: "", authDomain: "", projectId: "", storageBucket: "", messagingSenderId: "", appId: "" });
    setFbSaved(true);
  };
  const copyConnectionCode = async () => {
    if (!fbForm.apiKey.trim() || !fbForm.authDomain.trim() || !fbForm.projectId.trim() || !fbForm.appId.trim()) {
      notify("Fill in and save the Firebase details first", "error"); return;
    }
    const code = encodeFirebaseConfig(fbForm);
    try {
      await navigator.clipboard.writeText(code);
      notify("Connection code copied — send it to your guards");
    } catch {
      notify("Couldn't copy automatically — select the code below and copy it manually", "error");
    }
  };

  const saveShift = async () => {
    const h = parseFloat(shiftHours);
    if (!h || h <= 0) { notify("Enter a shift length greater than 0", "error"); return; }
    await persistSettings({ ...settings, shift_hours: h });
    notify("Settings saved");
  };

  const saveChannel = async (section) => {
    const ch = channels[section];
    if (ch.enabled && !ch.recipient_email.trim()) { notify("Enter the recipient's email address", "error"); return; }
    await persistSettings({ ...settings, report_channels: channels });
    notify("Report settings saved");
  };
  const updateChannel = (section, patch) => setChannels((c) => ({ ...c, [section]: { ...c[section], ...patch } }));

  const addUser = async () => {
    if (!newUser.name.trim() || !newUser.username.trim() || newUser.password.length < 4) {
      notify("Provide name, username, and a password of at least 4 characters", "error"); return;
    }
    if (users.some((u) => u.username.toLowerCase() === newUser.username.trim().toLowerCase())) {
      notify("That username already exists", "error"); return;
    }
    const hash = await sha256(newUser.password);
    await persistUsers([{ id: uid("u_"), name: newUser.name, username: newUser.username, passwordHash: hash, role: newUser.role, active: true, created_at: Date.now() }, ...users]);
    setNewUser({ name: "", username: "", password: "", role: "guard" });
    notify("Account created");
  };

  const toggleUserActive = async (u) => {
    await persistUsers(users.map((x) => (x.id === u.id ? { ...x, active: !x.active } : x)));
  };

  return (
    <div>

                <b>This device can view but not save changes.</b> The person who owns this page needs to give you edit

              window, not inside this app), invite their account or set link access to Contributor or above, then have
              them open the same link and sign in. A downloaded HTML file never syncs this way — see Firebase Sync below

        <details style={{ marginBottom: 14 }}>
          <summary style={{ cursor: "pointer", fontSize: 12.5, fontWeight: 600, color: C.navy }}>How to get these values from Firebase</summary>
          <ol style={{ fontSize: 12, color: C.ink50, lineHeight: 1.8, paddingLeft: 18, margin: "8px 0 0" }}>
            <li>Go to <span style={{ fontFamily: FONT_MONO }}>console.firebase.google.com</span> and create a project (free tier is enough).</li>
            <li><b>Build → Firestore Database → Create database</b> (any region, start in production mode).</li>
            <li><b>Build → Authentication → Sign-in method</b> → enable <b>Anonymous</b>.</li>
            <li>In <b>Firestore → Rules</b>, replace the rules with: <span style={{ fontFamily: FONT_MONO, display: "block", background: C.paperDim, padding: 8, borderRadius: 6, marginTop: 4 }}>{`allow read, write: if request.auth != null;`}</span></li>
            <li>Project settings (gear icon) → <b>General</b> → scroll to "Your apps" → add a <b>Web app</b> → copy the values it gives you into the fields below.</li>
          </ol>
        </details>

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
          <Field label="API Key"><input style={inputStyle} value={fbForm.apiKey} onChange={(e) => setFbForm((f) => ({ ...f, apiKey: e.target.value }))} /></Field>
          <Field label="Auth Domain"><input style={inputStyle} value={fbForm.authDomain} onChange={(e) => setFbForm((f) => ({ ...f, authDomain: e.target.value }))} placeholder="project.firebaseapp.com" /></Field>
          <Field label="Project ID"><input style={inputStyle} value={fbForm.projectId} onChange={(e) => setFbForm((f) => ({ ...f, projectId: e.target.value }))} /></Field>
          <Field label="App ID"><input style={inputStyle} value={fbForm.appId} onChange={(e) => setFbForm((f) => ({ ...f, appId: e.target.value }))} /></Field>
          <Field label="Storage Bucket (optional)"><input style={inputStyle} value={fbForm.storageBucket} onChange={(e) => setFbForm((f) => ({ ...f, storageBucket: e.target.value }))} /></Field>
          <Field label="Messaging Sender ID (optional)"><input style={inputStyle} value={fbForm.messagingSenderId} onChange={(e) => setFbForm((f) => ({ ...f, messagingSenderId: e.target.value }))} /></Field>
        </div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 12 }}>
          <Btn tone="navy" onClick={connectFirebase}>Save &amp; Connect</Btn>
          {syncMode === "firebase" && <Btn tone="red" onClick={disconnectFirebase}>Disconnect</Btn>}
        </div>

        <div style={{ borderTop: `1px dashed ${C.line}`, paddingTop: 12 }}>
          <div style={{ fontSize: 12.5, fontWeight: 600, marginBottom: 4 }}>Give guards and your manager access</div>
          <p style={{ fontSize: 12, color: C.ink50, margin: "0 0 8px", lineHeight: 1.6 }}>
            They can't reach this Settings screen on their own phones — instead, send them this one code (over
            WhatsApp, SMS, etc). On their phone, before logging in, they tap "Connect to the shared database" on the
            login screen and paste it in.
          </p>
          <Btn size="sm" tone="paper" icon={ShieldCheck} onClick={copyConnectionCode}>Copy Connection Code</Btn>
          {fbForm.apiKey && fbForm.authDomain && fbForm.projectId && fbForm.appId && (
            <div style={{ fontFamily: FONT_MONO, fontSize: 10.5, color: C.ink50, background: C.paperDim, padding: 8, borderRadius: 6, marginTop: 8, wordBreak: "break-all", userSelect: "all" }}>
              {encodeFirebaseConfig(fbForm)}
            </div>
          )}
        </div>
      </div>

      <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, padding: 16, marginBottom: 16 }}>
        <h3 style={{ fontFamily: FONT_SERIF, fontSize: 16, margin: "0 0 4px" }}>Shift Length</h3>
        <p style={{ fontSize: 12.5, color: C.ink50, margin: "0 0 12px", lineHeight: 1.5 }}>
          There's no fixed arrival or departure time — employees can check in whenever they arrive. A shift is considered
          complete this many hours after check-in; anything worked beyond that is counted as overtime, shown throughout
          the app and in reports.
        </p>
        <div style={{ display: "flex", gap: 10, alignItems: "flex-end" }}>
          <Field label="Standard shift length (hours)">
            <input type="number" min="1" max="24" step="0.5" style={{ ...inputStyle, maxWidth: 140 }} value={shiftHours} onChange={(e) => setShiftHours(e.target.value)} />
          </Field>
          <Btn tone="navy" onClick={saveShift}>Save</Btn>
        </div>
      </div>

      <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, padding: 16, marginBottom: 16 }}>
        <h3 style={{ fontFamily: FONT_SERIF, fontSize: 16, margin: "0 0 4px" }}>Report Delivery</h3>
        <p style={{ fontSize: 12.5, color: C.ink50, margin: "0 0 14px", lineHeight: 1.5 }}>
          Each section can go to a different manager — e.g. attendance to HR, security to your security manager,
          inventory to procurement. Since this app has no background server, it can't send email on its own: whoever
          opens the app sees a reminder when a report is due, and one tap builds it and opens your email app with the
          CSV ready to attach.
        </p>
        {["attendance", "security", "inventory"].map((section) => {
          const ch = channels[section];
          const label = { attendance: "Attendance", security: "Security (Visitors & Contractors)", inventory: "Inventory" }[section];
          return (
            <div key={section} style={{ borderTop: section !== "attendance" ? `1px dashed ${C.line}` : "none", paddingTop: section !== "attendance" ? 14 : 0, marginTop: section !== "attendance" ? 14 : 0 }}>
              <div style={{ fontSize: 13.5, fontWeight: 700, marginBottom: 8 }}>{label}</div>
              <label style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10, cursor: "pointer" }}>
                <input type="checkbox" checked={ch.enabled} onChange={(e) => updateChannel(section, { enabled: e.target.checked })} />
                <span style={{ fontSize: 13 }}>Enable scheduled reminders for this section</span>
              </label>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                <Field label="Recipient's name"><input style={inputStyle} value={ch.recipient_name} onChange={(e) => updateChannel(section, { recipient_name: e.target.value })} /></Field>
                <Field label="Recipient's email"><input type="email" style={inputStyle} value={ch.recipient_email} onChange={(e) => updateChannel(section, { recipient_email: e.target.value })} placeholder="manager@company.com" /></Field>
                <Field label="Frequency">
                  <select style={inputStyle} value={ch.frequency} onChange={(e) => updateChannel(section, { frequency: e.target.value })}>
                    <option value="daily">Every day</option><option value="weekly">Every week</option><option value="monthly">Every month</option>
                  </select>
                </Field>
                <Field label="Reminder time"><input type="time" style={inputStyle} value={ch.time} onChange={(e) => updateChannel(section, { time: e.target.value })} /></Field>
              </div>
              <div style={{ fontSize: 11.5, color: C.ink50, marginBottom: 10 }}>Last sent: {ch.last_sent ? fmtDate(ch.last_sent) : "never"}</div>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                <Btn size="sm" tone="navy" onClick={() => saveChannel(section)}>Save</Btn>
                <Btn size="sm" tone="paper" icon={FileDown} onClick={() => sendReport(section, ch.frequency)} disabled={!ch.recipient_email.trim()}>Send now</Btn>
              </div>
            </div>
          );
        })}
      </div>

      <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, padding: 16, marginBottom: 16 }}>
        <h3 style={{ fontFamily: FONT_SERIF, fontSize: 16, margin: "0 0 12px" }}>Guard &amp; Admin Accounts</h3>
        <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 14 }}>
          {users.map((u) => (
            <div key={u.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 10px", background: C.paperDim, borderRadius: 7 }}>
              <div>
                <span style={{ fontWeight: 600, fontSize: 13.5 }}>{u.name}</span>
                <span style={{ fontFamily: FONT_MONO, fontSize: 11.5, color: C.ink50, marginLeft: 8 }}>{u.username} · {u.role}</span>
                {!u.active && <span style={{ marginLeft: 8 }}><Badge tone="missing">DISABLED</Badge></span>}
              </div>
              <button onClick={() => toggleUserActive(u)} style={{ background: "none", border: `1px solid ${C.line}`, borderRadius: 6, padding: "4px 8px", fontSize: 11.5, cursor: "pointer" }}>
                {u.active ? "Disable" : "Enable"}
              </button>
            </div>
          ))}
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
          <Field label="Full name"><input style={inputStyle} value={newUser.name} onChange={(e) => setNewUser((n) => ({ ...n, name: e.target.value }))} /></Field>
          <Field label="Username"><input style={inputStyle} value={newUser.username} onChange={(e) => setNewUser((n) => ({ ...n, username: e.target.value }))} /></Field>
          <Field label="Password"><input type="password" style={inputStyle} value={newUser.password} onChange={(e) => setNewUser((n) => ({ ...n, password: e.target.value }))} /></Field>
          <Field label="Role">
            <select style={inputStyle} value={newUser.role} onChange={(e) => setNewUser((n) => ({ ...n, role: e.target.value }))}>
              <option value="guard">Security Guard</option><option value="admin">Manager / Admin</option>
            </select>
          </Field>
        </div>
        <Btn tone="navy" icon={UserPlus} onClick={addUser}>Create Account</Btn>
      </div>

      <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, padding: 16 }}>
        <h3 style={{ fontFamily: FONT_SERIF, fontSize: 16, margin: "0 0 8px" }}>Data Management</h3>
        <p style={{ fontSize: 13, color: C.ink50, marginTop: 0, marginBottom: 14 }}>
          This app starts with your login accounts only — no fake employees or attendance. Use the options below only if
          you want to load a sample dataset for testing, or wipe everything to start completely over.
        </p>

        <div style={{ marginBottom: 14 }}>
          <div style={{ fontSize: 13.5, fontWeight: 600, marginBottom: 4 }}>Load sample data</div>
          <div style={{ fontSize: 12, color: C.ink50, marginBottom: 8 }}>Replaces everything with 15 demo employees and sample attendance, for testing. Your real data (if any) will be lost.</div>
          {!confirmSample ? (
            <Btn tone="paper" icon={RefreshCw} onClick={() => setConfirmSample(true)}>Load Sample Data</Btn>
          ) : (
            <div style={{ display: "flex", gap: 8 }}>
              <Btn tone="ghost" onClick={() => setConfirmSample(false)}>Cancel</Btn>
              <Btn tone="amber" disabled={busy} onClick={async () => { await loadSample(); setConfirmSample(false); }}>{busy ? "Loading…" : "Confirm — Load Sample Data"}</Btn>
            </div>
          )}
        </div>

        <div>
          <div style={{ fontSize: 13.5, fontWeight: 600, marginBottom: 4 }}>Erase everything — fresh start</div>
          <div style={{ fontSize: 12, color: C.ink50, marginBottom: 8 }}>Permanently deletes all employees, attendance, and audit history. Your login accounts are kept so you can still sign in afterward.</div>
          {!confirmErase ? (
            <Btn tone="red" icon={Trash2} onClick={() => setConfirmErase(true)}>Erase Everything</Btn>
          ) : (
            <div style={{ display: "flex", gap: 8 }}>
              <Btn tone="ghost" onClick={() => setConfirmErase(false)}>Cancel</Btn>
              <Btn tone="red" disabled={busy} onClick={async () => { await eraseAll(); setConfirmErase(false); }}>{busy ? "Erasing…" : "Confirm — Erase Everything"}</Btn>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}


const rootEl = document.getElementById("root");
const root = ReactDOM.createRoot(rootEl);
root.render(<App />);

</script>
</body>
</html>
