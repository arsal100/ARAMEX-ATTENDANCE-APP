function Dashboard({ session, employees, attendance, settings, empById, today, goto, sendReport, leaves, stockItems, stockMovements, visitors, handoverRecords, incidents }) {
  const todays = attendance.filter((a) => a.date === today);
  const inside = todays.filter((a) => a.status === "INSIDE");
  const checkedOutToday = todays.filter((a) => a.status === "CHECKED_OUT");
  const activeEmployees = employees.filter((e) => e.active);
  const checkedInIds = new Set(todays.map((a) => a.employee_id));
  const onLeaveToday = activeEmployees.filter((e) => findLeave(leaves, e.id, today));
  const onLeaveIds = new Set(onLeaveToday.map((e) => e.id));
  const notCheckedIn = activeEmployees.filter((e) => !checkedInIds.has(e.id) && !onLeaveIds.has(e.id));
  const shiftHours = settings.shift_hours || 9;
  const overtimeToday = todays.filter((a) => {
    if (a.status === "INSIDE") return elapsedMinutes(a.date, a.time_in) > shiftHours * 60;
    return overtimeMinutes(a.total_minutes, shiftHours) > 0;
  });
  const visitorsInside = (visitors || []).filter((v) => v.status === "INSIDE");
  const lowStockItems = (stockItems || []).filter((i) => i.active).map((i) => ({ ...i, level: stockLevel(i.id, stockMovements || []) })).filter((i) => i.level <= i.min_threshold);
  const openIncidents = (incidents || []).filter((i) => i.status === "Open" || i.status === "Under Investigation");
  const seriousOpenIncidents = openIncidents.filter((i) => i.severity === "High" || i.severity === "Critical");

  const channels = settings.report_channels || { attendance: defaultChannel(), security: defaultChannel(), inventory: defaultChannel() };
  const dueSections = session.role === "admin"
    ? ["attendance", "security", "inventory"].filter((s) => isReportDue(channels[s]))
    : [];
  const sectionLabel = { attendance: "Attendance", security: "Security", inventory: "Inventory" };

  return (
    <div>
      <div style={{
        background: `linear-gradient(135deg, ${C.navy}, ${C.slate})`, borderRadius: 16, padding: "22px 24px", marginBottom: 22,
        color: "#fff", display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 12,
        boxShadow: "0 4px 16px rgba(37,99,235,0.2)",
      }}>
        <div>
          <div style={{ fontFamily: FONT_SERIF, fontSize: 22, marginBottom: 4 }}>{timeGreeting()}, {session.name.split(" ")[0]}</div>
          <div style={{ fontSize: 13, color: "rgba(255,255,255,0.82)" }}>{fmtDate(today)} · Today's Dashboard</div>
        </div>
        <div style={{ fontFamily: FONT_MONO, fontSize: 11, color: "#fff", background: "rgba(255,255,255,0.18)", padding: "6px 14px", borderRadius: 20, fontWeight: 600, letterSpacing: 0.3 }}>
          {session.role.toUpperCase()}
        </div>
      </div>

      {(handoverRecords || []).some((r) => r.status === "PENDING") && (
        <div style={{ background: "#FEF3C7", border: `1px solid #FDE68A`, borderRadius: 10, padding: "12px 14px", marginBottom: 12, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, flexWrap: "wrap" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <RefreshCw size={18} color={C.amberDeep} />
            <div style={{ fontWeight: 700, fontSize: 13.5, color: C.ink }}>A shift handover is waiting for you to take over</div>
          </div>
          <Btn size="sm" tone="amber" onClick={() => goto("handover")}>Review &amp; Take Over</Btn>
        </div>
      )}

      {dueSections.map((s) => {
        const ch = channels[s];
        return (
          <div key={s} style={{ background: "#FCEFE0", border: `1px solid #F2D6A6`, borderRadius: 10, padding: "12px 14px", marginBottom: 12, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, flexWrap: "wrap" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <AlertTriangle size={18} color={C.amberDeep} />
              <div>
                <div style={{ fontWeight: 700, fontSize: 13.5, color: C.ink }}>
                  {sectionLabel[s]}: {ch.frequency[0].toUpperCase() + ch.frequency.slice(1)} report due to {ch.recipient_name || ch.recipient_email}
                </div>
                <div style={{ fontSize: 12, color: C.ink50 }}>Opens your email app with the report — you attach and send.</div>
              </div>
            </div>
            <Btn size="sm" tone="amber" onClick={() => sendReport(s, ch.frequency)}>Send Report</Btn>
          </div>
        );
      })}

      {lowStockItems.length > 0 && (
        <div style={{ background: "#F7E7E5", border: `1px solid #E9C3BE`, borderRadius: 10, padding: "12px 14px", marginBottom: 18, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, flexWrap: "wrap" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <Package size={18} color={C.redDeep} />
            <div>
              <div style={{ fontWeight: 700, fontSize: 13.5, color: C.redDeep }}>{lowStockItems.length} item(s) low on stock — reorder needed</div>
              <div style={{ fontSize: 12, color: C.ink50 }}>{lowStockItems.map((i) => i.name).join(", ")}</div>
            </div>
          </div>
          <Btn size="sm" tone="red" onClick={() => goto("inventory")}>View Inventory</Btn>
        </div>
      )}

      {seriousOpenIncidents.length > 0 && (
        <div style={{ background: "#FEE2E2", border: `1px solid #FECACA`, borderRadius: 10, padding: "12px 14px", marginBottom: 18, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, flexWrap: "wrap" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <AlertTriangle size={18} color={C.redDeep} />
            <div>
              <div style={{ fontWeight: 700, fontSize: 13.5, color: C.redDeep }}>{seriousOpenIncidents.length} high/critical incident(s) open</div>
              <div style={{ fontSize: 12, color: C.ink50 }}>{seriousOpenIncidents.map((i) => i.type).join(", ")}</div>
            </div>
          </div>
          <Btn size="sm" tone="red" onClick={() => goto("incidents")}>View Incidents</Btn>
        </div>
      )}

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(140px,1fr))", gap: 10, marginBottom: 22 }}>
        <StatCard label="Total Employees" value={activeEmployees.length} icon={Users} tone="navy" />
        <StatCard label="Checked In Today" value={todays.length} icon={DoorOpen} tone="green" />
        <StatCard label="Currently Inside" value={inside.length} icon={Clock} tone="amber" />
        <StatCard label="Checked Out Today" value={checkedOutToday.length} icon={DoorClosed} tone="slate" />
        <StatCard label="Not Checked In" value={notCheckedIn.length} icon={XCircle} tone="red" />
        <StatCard label="On Leave Today" value={onLeaveToday.length} icon={UserX} tone="slate" />
        <StatCard label="In Overtime" value={overtimeToday.length} icon={AlertTriangle} tone="amber" />
        <StatCard label="Visitors/Contractors Inside" value={visitorsInside.length} icon={UserPlus} tone="navy" />
        <StatCard label="Low Stock Items" value={lowStockItems.length} icon={Package} tone={lowStockItems.length ? "red" : "slate"} />
        <StatCard label="Open Incidents" value={openIncidents.length} icon={AlertTriangle} tone={seriousOpenIncidents.length ? "red" : (openIncidents.length ? "amber" : "slate")} />
      </div>

      <SectionTitle title="Currently Inside" sub={`${inside.length} on site`} />
      <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, overflow: "hidden", marginBottom: 22 }}>
        {inside.length === 0 ? <EmptyState icon={DoorOpen} title="No one is currently inside" /> : (
          <TableScroll headers={["Employee", "ID", "Company", "Time In", "Duration"]}>
            {inside.map((a) => {
              const e = empById[a.employee_id]; if (!e) return null;
              const mins = Math.round((Date.now() - new Date(`${a.date}T${a.time_in}`)) / 60000);
              return (
                <tr key={a.id}>
                  <Td>{e.name}</Td>
                  <TdMono>{e.employee_number}</TdMono>
                  <Td>{e.company}</Td>
                  <TdMono>{fmtTime(a.time_in)}</TdMono>
                  <Td>{fmtDuration(mins)}</Td>
                </tr>
              );
            })}
          </TableScroll>
        )}
      </div>

      <SectionTitle title="Today's Attendance" sub={`${todays.length} record(s)`} action={{ label: "View all", onClick: () => goto("attendance") }} />
      <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, overflow: "hidden" }}>
        {todays.length === 0 ? <EmptyState icon={ClipboardList} title="No attendance recorded yet today" /> : (
          <TableScroll headers={["Employee", "Time In", "Time Out", "Total Hours", "Status", "Recorded By"]}>
            {todays.slice(0, 8).map((a) => {
              const e = empById[a.employee_id]; if (!e) return null;
              return (
                <tr key={a.id}>
                  <Td>{e.name}</Td>
                  <TdMono>{fmtTime(a.time_in)}</TdMono>
                  <TdMono>{a.time_out ? fmtTime(a.time_out) : "—"}</TdMono>
                  <Td>{a.total_minutes != null ? fmtDuration(a.total_minutes) : "—"}</Td>
                  <Td><StatusBadge a={a} shiftHours={settings.shift_hours} /></Td>
                  <Td>{a.status === "INSIDE" ? a.checked_in_by : a.checked_out_by}</Td>
                </tr>
              );
            })}
          </TableScroll>
        )}
      </div>
    </div>
  );
}

function StatusBadge({ a, shiftHours }) {
  const sh = shiftHours || 9;
  if (a.status === "INSIDE") {
    const elapsed = elapsedMinutes(a.date, a.time_in);
    return elapsed > sh * 60 ? <Badge tone="overtime">OVERTIME · INSIDE</Badge> : <Badge tone="inside">INSIDE</Badge>;
  }
  const ot = overtimeMinutes(a.total_minutes, sh);
  return ot > 0 ? <Badge tone="overtime">+{fmtDuration(ot)} OT</Badge> : <Badge tone="out">CHECKED OUT</Badge>;
}

function SectionTitle({ title, sub, action }) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", marginBottom: 10, marginTop: 4 }}>
      <div>
        <h2 style={{ fontFamily: FONT_SERIF, fontSize: 19, color: C.ink, margin: 0 }}>{title}</h2>
        {sub && <div style={{ fontSize: 12.5, color: C.ink50, marginTop: 2 }}>{sub}</div>}
      </div>
      {action && (
        <button onClick={action.onClick} style={{ background: "none", border: "none", color: C.navy, fontFamily: FONT_SANS, fontWeight: 600, fontSize: 12.5, cursor: "pointer", display: "flex", alignItems: "center", gap: 2 }}>
          {action.label} <ChevronRight size={14} />
        </button>
      )}
    </div>
  );
}

function TableScroll({ headers, children }) {
  return (
    <div style={{ overflowX: "auto" }}>
      <table style={{ width: "100%", borderCollapse: "collapse", minWidth: 560 }}>
        <thead>
          <tr style={{ background: C.paperDim }}>
            {headers.map((h) => (
              <th key={h} style={{ textAlign: "left", padding: "9px 12px", fontSize: 11.5, fontFamily: FONT_SANS, fontWeight: 700, color: C.ink50, borderBottom: `1px solid ${C.line}` }}>{h}</th>
            ))}
          </tr>
        </thead>
        <tbody>{children}</tbody>
      </table>
    </div>
  );
}
function Td({ children }) { return <td style={{ padding: "10px 12px", fontSize: 13.5, color: C.ink, borderBottom: `1px solid ${C.line}` }}>{children}</td>; }
function TdMono({ children }) { return <td style={{ padding: "10px 12px", fontSize: 13, color: C.ink, fontFamily: FONT_MONO, borderBottom: `1px solid ${C.line}` }}>{children}</td>; }

/* ---------------------------------------------------------------------
   EMPLOYEE SEARCH (shared widget)
--------------------------------------------------------------------- */
function EmployeeSearch({ employees, placeholder, onPick, filterFn }) {
  const [q, setQ] = useState("");
  const results = useMemo(() => {
    let pool = employees;
    if (filterFn) pool = pool.filter(filterFn);
    if (!q.trim()) return pool.slice(0, 6);
    const term = q.toLowerCase();
    return pool.filter((e) =>
      e.name.toLowerCase().includes(term) ||
      e.employee_number.toLowerCase().includes(term) ||
      e.company.toLowerCase().includes(term) ||
      e.department.toLowerCase().includes(term)
    ).slice(0, 8);
  }, [q, employees, filterFn]);

  return (
    <div>
      <div style={{ position: "relative", marginBottom: 10 }}>
        <Search size={17} style={{ position: "absolute", left: 12, top: 13, color: C.ink50 }} />
        <input autoFocus style={{ ...inputStyle, paddingLeft: 38, fontSize: 16 }} placeholder={placeholder} value={q} onChange={(e) => setQ(e.target.value)} />
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
        {results.length === 0 && <EmptyState icon={Search} title="No matching employees" sub="Try a different name, ID, or company" />}
        {results.map((e) => (
          <button key={e.id} onClick={() => onPick(e)} style={{
            textAlign: "left", background: "#fff", border: `1px solid ${C.line}`, borderRadius: 9, padding: "11px 13px",
            cursor: "pointer", display: "flex", justifyContent: "space-between", alignItems: "center",
          }}>
            <div>
              <div style={{ fontSize: 14.5, fontWeight: 600, color: C.ink }}>{e.name}</div>
              <div style={{ fontSize: 12, color: C.ink50, marginTop: 2 }}>{e.company} · {e.department}</div>
            </div>
            <span style={{ fontFamily: FONT_MONO, fontSize: 12, color: C.navy, background: C.paperDim, padding: "3px 7px", borderRadius: 5 }}>{e.employee_number}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------
   CHECK-IN
--------------------------------------------------------------------- */
function CheckInScreen({ session, employees, attendance, settings, leaves, persistAttendance, audit, persistAudit, notify, today }) {
  const [selected, setSelected] = useState(null);
  const [remarks, setRemarks] = useState("");
  const [submitting, setSubmitting] = useState(false);
  const [success, setSuccess] = useState(null);
  const [backdate, setBackdate] = useState(false);
  const [customTime, setCustomTime] = useState(nowTimeStr().slice(0, 5));

  const insideIds = useMemo(() => new Set(attendance.filter((a) => a.status === "INSIDE").map((a) => a.employee_id)), [attendance]);
  const alreadyInside = selected && insideIds.has(selected.id);
  const onLeave = selected && findLeave(leaves, selected.id, today);

  const pickEmployee = (e) => { setSelected(e); setBackdate(false); setCustomTime(nowTimeStr().slice(0, 5)); };

  const doCheckIn = async () => {
    if (!selected || submitting) return;
    if (!selected.active) { notify("This employee is inactive and cannot be checked in", "error"); return; }
    if (insideIds.has(selected.id)) { notify("Already inside — check out first", "error"); return; }
    const now = new Date();
    let time_in = nowTimeStr(now);
    if (backdate) {
      if (!customTime) { notify("Enter a valid time", "error"); return; }
      if (`${customTime}:00` > nowTimeStr(now)) { notify("Check-in time can't be in the future", "error"); return; }
      time_in = `${customTime}:00`;
    }
    setSubmitting(true);
    const record = {
      id: uid("a_"), employee_id: selected.id, date: todayStr(now), time_in, time_out: null, total_minutes: null,
      status: "INSIDE", checked_in_by: session.name, checked_out_by: null,
      remarks_in: remarks || "", remarks_out: "",
      created_at: Date.now(), updated_at: Date.now(),
    };
    await persistAttendance([record, ...attendance]);
    await persistAudit([{ id: uid("log_"), attendance_id: record.id, action: "CHECK_IN", old_value: null, new_value: `IN ${time_in}`, performed_by: session.name, reason: "", timestamp: Date.now() }, ...audit]);
    setSubmitting(false);
    setSuccess({ ...record, employee: selected });
    setSelected(null); setRemarks(""); setBackdate(false);
    notify(`${selected.name} checked in`);
  };

  if (success) {
    return (
      <div>
        <SectionTitle title="Check In" />
        <div style={{ background: "#fff", border: `2px solid ${C.green}`, borderRadius: 12, padding: 24, textAlign: "center" }}>
          <CheckCircle2 size={44} color={C.green} style={{ marginBottom: 10 }} />
          <div style={{ fontFamily: FONT_SERIF, fontSize: 21, color: C.ink, marginBottom: 4 }}>Check-In Successful</div>
          <div style={{ display: "grid", gridTemplateColumns: "auto auto", gap: "6px 18px", justifyContent: "center", marginTop: 14, textAlign: "left" }}>
            <span style={{ color: C.ink50, fontSize: 13 }}>Employee</span><span style={{ fontWeight: 600 }}>{success.employee.name}</span>
            <span style={{ color: C.ink50, fontSize: 13 }}>Employee No.</span><span style={{ fontFamily: FONT_MONO }}>{success.employee.employee_number}</span>
            <span style={{ color: C.ink50, fontSize: 13 }}>Date</span><span>{fmtDate(success.date)}</span>
            <span style={{ color: C.ink50, fontSize: 13 }}>Time</span><span style={{ fontFamily: FONT_MONO }}>{fmtTime(success.time_in)}</span>
          </div>
          <div style={{ marginTop: 20 }}>
            <Btn tone="navy" onClick={() => setSuccess(null)} icon={DoorOpen}>Check In Another Employee</Btn>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div>
      <SectionTitle title="Check In" sub="Search, confirm, and record arrival — no manual time entry" />
      {!selected ? (
        <EmployeeSearch employees={employees} placeholder="Search name or employee number…" onPick={pickEmployee} />
      ) : (
        <div>
          <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 12, padding: 18, marginBottom: 14 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
              <div>
                <div style={{ fontFamily: FONT_SERIF, fontSize: 20, color: C.ink }}>{selected.name}</div>
                <div style={{ fontFamily: FONT_MONO, fontSize: 12.5, color: C.navy, marginTop: 2 }}>{selected.employee_number}</div>
              </div>
              <button onClick={() => setSelected(null)} style={{ background: "none", border: "none", color: C.ink50, cursor: "pointer" }}><X size={19} /></button>
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginTop: 14, fontSize: 13.5 }}>
              <InfoRow icon={Building2} label="Company" value={selected.company} />
              <InfoRow icon={Briefcase} label="Department" value={selected.department} />
              <InfoRow icon={UserCog} label="Designation" value={selected.designation} />
              <InfoRow icon={Phone} label="Phone" value={selected.phone || "—"} />
            </div>
            {!selected.active && (
              <div style={{ marginTop: 12, background: "#F7E7E5", color: C.redDeep, padding: "8px 10px", borderRadius: 7, fontSize: 13, display: "flex", gap: 6, alignItems: "center" }}>
                <AlertTriangle size={15} /> Employee is inactive — check-in blocked.
              </div>
            )}
            {alreadyInside && (
              <div style={{ marginTop: 12, background: "#FCEFE0", color: C.amberDeep, padding: "8px 10px", borderRadius: 7, fontSize: 13, display: "flex", gap: 6, alignItems: "center" }}>
                <Clock size={15} /> Already Inside — must check out before checking in again.
              </div>
            )}
            {onLeave && (
              <div style={{ marginTop: 12, background: "#F7E7E5", color: C.redDeep, padding: "8px 10px", borderRadius: 7, fontSize: 13, display: "flex", gap: 6, alignItems: "center" }}>
                <UserX size={15} /> Marked on {onLeave.type} today{onLeave.reason ? ` (${onLeave.reason})` : ""} — you can still check them in if they came anyway.
              </div>
            )}
          </div>

          <BackdateField label="Arrived earlier? Set actual check-in time" active={backdate}
            onToggle={() => { setBackdate((b) => !b); setCustomTime(nowTimeStr().slice(0, 5)); }}
            time={customTime} onTimeChange={setCustomTime} />

          <Field label="Remarks (optional)">
            <RemarksPicker value={remarks} onChange={setRemarks} />
          </Field>

          <Btn full tone="green" size="lg" icon={DoorOpen} onClick={doCheckIn} disabled={submitting || alreadyInside || !selected.active}>
            {submitting ? "Recording…" : "CHECK IN"}
          </Btn>
        </div>
      )}
    </div>
  );
}

function InfoRow({ icon: Icon, label, value }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
      <Icon size={14} color={C.ink50} />
      <div>
        <div style={{ fontSize: 10.5, color: C.ink50 }}>{label}</div>
        <div style={{ fontSize: 13.5, color: C.ink, fontWeight: 500 }}>{value}</div>
      </div>
    </div>
  );
}

const REMARK_OPTIONS = ["Official duty", "Temporary visitor", "Forgot ID", "Late arrival", "Emergency", "Other"];
function RemarksPicker({ value, onChange }) {
  const [custom, setCustom] = useState(!REMARK_OPTIONS.includes(value) && !!value);
  return (
    <div>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: custom ? 8 : 0 }}>
        {REMARK_OPTIONS.map((r) => (
          <button key={r} type="button" onClick={() => { onChange(r === value ? "" : r); setCustom(false); }} style={{
            padding: "6px 11px", borderRadius: 20, fontSize: 12.5, cursor: "pointer",
            border: `1px solid ${value === r ? C.navy : C.line}`, background: value === r ? C.navy : "#fff", color: value === r ? "#fff" : C.ink,
          }}>{r}</button>
        ))}
        <button type="button" onClick={() => setCustom((c) => !c)} style={{
          padding: "6px 11px", borderRadius: 20, fontSize: 12.5, cursor: "pointer",
          border: `1px dashed ${C.ink50}`, background: "#fff", color: C.ink50,
        }}>+ Custom</button>
      </div>
      {custom && <input style={inputStyle} placeholder="Type a remark…" value={value} onChange={(e) => onChange(e.target.value)} />}
    </div>
  );
}

function BackdateField({ label, active, onToggle, time, onTimeChange }) {
  if (!active) {
    return (
      <button type="button" onClick={onToggle} style={{
        background: "none", border: "none", color: C.navy, fontSize: 12.5, fontWeight: 600,
        cursor: "pointer", textDecoration: "underline", padding: 0, marginBottom: 14, display: "block",
      }}>
        {label}
      </button>
    );
  }
  return (
    <div style={{ background: "#FCEFE0", border: `1px solid #F2D6A6`, borderRadius: 9, padding: "12px 14px", marginBottom: 14 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 9 }}>
        <span style={{ fontSize: 12, fontWeight: 700, color: C.amberDeep, letterSpacing: 0.3 }}>SET ACTUAL TIME</span>
        <button type="button" onClick={onToggle} style={{ background: "none", border: "none", color: C.ink50, cursor: "pointer", fontSize: 12 }}>Use current time</button>
      </div>
      <div style={{ display: "flex", gap: 7, alignItems: "center", flexWrap: "wrap" }}>
        <input type="time" style={{ ...inputStyle, maxWidth: 130, background: "#fff" }} value={time} onChange={(e) => onTimeChange(e.target.value)} />
        {[5, 15, 30, 60].map((m) => (
          <button key={m} type="button" onClick={() => onTimeChange(shiftTimeStr(time, -m))} style={{
            padding: "6px 10px", borderRadius: 16, fontSize: 12, border: `1px solid ${C.amberDeep}`, background: "#fff", color: C.amberDeep, cursor: "pointer",
          }}>-{m < 60 ? `${m}m` : "1h"}</button>
        ))}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------
   CHECK-OUT
--------------------------------------------------------------------- */
function CheckOutScreen({ session, employees, attendance, settings, persistAttendance, audit, persistAudit, notify, today }) {
  const [selected, setSelected] = useState(null); // employee
  const [remarks, setRemarks] = useState("");
  const [submitting, setSubmitting] = useState(false);
  const [success, setSuccess] = useState(null);
  const [backdate, setBackdate] = useState(false);
  const [customTime, setCustomTime] = useState(nowTimeStr().slice(0, 5));

  const insideRecords = useMemo(() => attendance.filter((a) => a.status === "INSIDE"), [attendance]);
  const insideIds = useMemo(() => new Set(insideRecords.map((a) => a.employee_id)), [insideRecords]);
  const activeRecord = selected ? insideRecords.find((a) => a.employee_id === selected.id) : null;

  const pickEmployee = (e) => { setSelected(e); setBackdate(false); setCustomTime(nowTimeStr().slice(0, 5)); };

  const doCheckOut = async () => {
    if (!activeRecord || submitting) return;
    const now = new Date();
    let time_out = nowTimeStr(now);
    if (backdate) {
      if (!customTime) { notify("Enter a valid time", "error"); return; }
      if (`${customTime}:00` > nowTimeStr(now)) { notify("Check-out time can't be in the future", "error"); return; }
      if (`${customTime}:00` <= activeRecord.time_in) { notify(`Check-out time must be after the check-in time (${fmtTime(activeRecord.time_in)})`, "error"); return; }
      time_out = `${customTime}:00`;
    }
    setSubmitting(true);
    const total_minutes = minutesBetween(activeRecord.date, activeRecord.time_in, time_out);
    const updated = { ...activeRecord, time_out, total_minutes, status: "CHECKED_OUT", checked_out_by: session.name, remarks_out: remarks || "", updated_at: Date.now() };
    const next = attendance.map((a) => (a.id === activeRecord.id ? updated : a));
    await persistAttendance(next);
    await persistAudit([{ id: uid("log_"), attendance_id: activeRecord.id, action: "CHECK_OUT", old_value: null, new_value: `OUT ${time_out}`, performed_by: session.name, reason: "", timestamp: Date.now() }, ...audit]);
    setSubmitting(false);
    setSuccess({ ...updated, employee: selected });
    setSelected(null); setRemarks(""); setBackdate(false);
    notify(`${selected.name} checked out`);
  };

  if (success) {
    return (
      <div>
        <SectionTitle title="Check Out" />
        <div style={{ background: "#fff", border: `2px solid ${C.red}`, borderRadius: 12, padding: 24, textAlign: "center" }}>
          <CheckCircle2 size={44} color={C.red} style={{ marginBottom: 10 }} />
          <div style={{ fontFamily: FONT_SERIF, fontSize: 21, color: C.ink, marginBottom: 4 }}>Check-Out Successful</div>
          {overtimeMinutes(success.total_minutes, settings.shift_hours || 9) > 0 && (
            <div style={{ marginBottom: 8 }}><Badge tone="overtime">+{fmtDuration(overtimeMinutes(success.total_minutes, settings.shift_hours || 9))} OVERTIME</Badge></div>
          )}
          <div style={{ display: "grid", gridTemplateColumns: "auto auto", gap: "6px 18px", justifyContent: "center", marginTop: 14, textAlign: "left" }}>
            <span style={{ color: C.ink50, fontSize: 13 }}>Employee</span><span style={{ fontWeight: 600 }}>{success.employee.name}</span>
            <span style={{ color: C.ink50, fontSize: 13 }}>Time In</span><span style={{ fontFamily: FONT_MONO }}>{fmtTime(success.time_in)}</span>
            <span style={{ color: C.ink50, fontSize: 13 }}>Time Out</span><span style={{ fontFamily: FONT_MONO }}>{fmtTime(success.time_out)}</span>
            <span style={{ color: C.ink50, fontSize: 13 }}>Total Time Inside</span><span style={{ fontWeight: 600 }}>{fmtDuration(success.total_minutes)}</span>
          </div>
          <div style={{ marginTop: 20 }}>
            <Btn tone="navy" onClick={() => setSuccess(null)} icon={DoorClosed}>Check Out Another Employee</Btn>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div>
      <SectionTitle title="Check Out" sub="Only employees currently inside can be checked out" />
      {!selected ? (
        <EmployeeSearch employees={employees} placeholder="Search employee currently inside…" onPick={pickEmployee} filterFn={(e) => insideIds.has(e.id)} />
      ) : !activeRecord ? (
        <div>
          <div style={{ background: "#F7E7E5", color: C.redDeep, padding: "12px 14px", borderRadius: 9, fontSize: 13.5, display: "flex", gap: 8, alignItems: "center", marginBottom: 12 }}>
            <AlertTriangle size={16} /> {selected.name} has no active check-in — cannot check out.
          </div>
          <Btn tone="ghost" onClick={() => setSelected(null)}>Search again</Btn>
        </div>
      ) : (
        <div>
          <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 12, padding: 18, marginBottom: 14 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
              <div>
                <div style={{ fontFamily: FONT_SERIF, fontSize: 20, color: C.ink }}>{selected.name}</div>
                <div style={{ fontFamily: FONT_MONO, fontSize: 12.5, color: C.navy, marginTop: 2 }}>{selected.employee_number}</div>
              </div>
              <button onClick={() => setSelected(null)} style={{ background: "none", border: "none", color: C.ink50, cursor: "pointer" }}><X size={19} /></button>
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginTop: 14, fontSize: 13.5 }}>
              <InfoRow icon={CalendarDays} label="Check-in Date" value={fmtDate(activeRecord.date)} />
              <InfoRow icon={Clock} label="Check-in Time" value={fmtTime(activeRecord.time_in)} />
            </div>
          </div>

          <BackdateField label="Already left? Set actual check-out time" active={backdate}
            onToggle={() => { setBackdate((b) => !b); setCustomTime(nowTimeStr().slice(0, 5)); }}
            time={customTime} onTimeChange={setCustomTime} />

          <Field label="Remarks (optional)">
            <RemarksPicker value={remarks} onChange={setRemarks} />
          </Field>

          <Btn full tone="red" size="lg" icon={DoorClosed} onClick={doCheckOut} disabled={submitting}>
            {submitting ? "Recording…" : "CHECK OUT"}
          </Btn>
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------------
   TODAY'S ATTENDANCE (full list)
--------------------------------------------------------------------- */
function AttendanceToday({ employees, attendance, empById, today, settings, leaves }) {
  const [tab, setTab] = useState("inside");
  const todays = attendance.filter((a) => a.date === today);
  const inside = todays.filter((a) => a.status === "INSIDE");
  const notCheckedIn = employees.filter((e) => e.active && !todays.some((a) => a.employee_id === e.id));

  return (
    <div>
      <SectionTitle title="Today's Attendance" sub={fmtDate(today)} />
      <div style={{ display: "flex", gap: 6, marginBottom: 12 }}>
        {[["inside", `Inside (${inside.length})`], ["all", `All (${todays.length})`], ["missing", `Not Checked In (${notCheckedIn.length})`]].map(([k, label]) => (
          <button key={k} onClick={() => setTab(k)} style={{
            padding: "7px 12px", borderRadius: 20, fontSize: 12.5, fontWeight: 600, cursor: "pointer",
            border: `1px solid ${tab === k ? C.navy : C.line}`, background: tab === k ? C.navy : "#fff", color: tab === k ? "#fff" : C.ink,
          }}>{label}</button>
        ))}
      </div>

      <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, overflow: "hidden" }}>
        {tab === "missing" ? (
          notCheckedIn.length === 0 ? <EmptyState icon={CheckCircle2} title="Everyone active has checked in today" /> : (
            <TableScroll headers={["Employee", "ID", "Company", "Department", "Status"]}>
              {notCheckedIn.map((e) => {
                const lv = findLeave(leaves, e.id, today);
                return (
                  <tr key={e.id}>
                    <Td>{e.name}</Td><TdMono>{e.employee_number}</TdMono><Td>{e.company}</Td><Td>{e.department}</Td>
                    <Td>{lv ? <Badge tone={lv.type === "Sick Leave" || lv.type === "Absent" ? "missing" : "neutral"}>{lv.type.toUpperCase()}</Badge> : <Badge tone="missing">NOT CHECKED IN</Badge>}</Td>
                  </tr>
                );
              })}
            </TableScroll>
          )
        ) : (
          (tab === "inside" ? inside : todays).length === 0 ? <EmptyState icon={ClipboardList} title="No records to show" /> : (
            <TableScroll headers={["Employee", "ID", "Time In", "Time Out", "Total Hours", "Status", "Recorded By"]}>
              {(tab === "inside" ? inside : todays).map((a) => {
                const e = empById[a.employee_id]; if (!e) return null;
                return (
                  <tr key={a.id}>
                    <Td>{e.name}</Td>
                    <TdMono>{e.employee_number}</TdMono>
                    <TdMono>{fmtTime(a.time_in)}</TdMono>
                    <TdMono>{a.time_out ? fmtTime(a.time_out) : "—"}</TdMono>
                    <Td>{a.total_minutes != null ? fmtDuration(a.total_minutes) : "—"}</Td>
                    <Td><StatusBadge a={a} shiftHours={settings.shift_hours} /></Td>
                    <Td>{a.status === "INSIDE" ? a.checked_in_by : a.checked_out_by}</Td>
                  </tr>
                );
              })}
            </TableScroll>
          )
        )}
      </div>
    </div>
  );
}

function HistoryScreen({ employees, attendance, empById, session, persistAttendance, audit, persistAudit, notify, settings }) {
  const [filters, setFilters] = useState({ dateFrom: "", dateTo: "", employee: "", company: "", department: "", guard: "", status: "" });
  const [sortBy, setSortBy] = useState("latest");
  const [editing, setEditing] = useState(null);

  const companies = useMemo(() => [...new Set(employees.map((e) => e.company))], [employees]);
  const departments = useMemo(() => [...new Set(employees.map((e) => e.department))], [employees]);
  const guards = useMemo(() => [...new Set(attendance.flatMap((a) => [a.checked_in_by, a.checked_out_by]).filter(Boolean))], [attendance]);

  const filtered = useMemo(() => {
    let rows = attendance.map((a) => ({ ...a, emp: empById[a.employee_id] })).filter((r) => r.emp);
    if (filters.dateFrom) rows = rows.filter((r) => r.date >= filters.dateFrom);
    if (filters.dateTo) rows = rows.filter((r) => r.date <= filters.dateTo);
    if (filters.employee) {
      const t = filters.employee.toLowerCase();
      rows = rows.filter((r) => r.emp.name.toLowerCase().includes(t) || r.emp.employee_number.toLowerCase().includes(t));
    }
    if (filters.company) rows = rows.filter((r) => r.emp.company === filters.company);
    if (filters.department) rows = rows.filter((r) => r.emp.department === filters.department);
    if (filters.guard) rows = rows.filter((r) => r.checked_in_by === filters.guard || r.checked_out_by === filters.guard);
    if (filters.status) {
      const shiftHours = settings.shift_hours || 9;
      rows = rows.filter((r) => {
        if (filters.status === "OVERTIME") {
          return r.status === "INSIDE" ? elapsedMinutes(r.date, r.time_in) > shiftHours * 60 : overtimeMinutes(r.total_minutes, shiftHours) > 0;
        }
        return r.status === filters.status;
      });
    }
    rows.sort((a, b) => {
      if (sortBy === "latest") return (b.date + b.time_in).localeCompare(a.date + a.time_in);
      if (sortBy === "earliest") return (a.date + a.time_in).localeCompare(b.date + b.time_in);
      if (sortBy === "name") return a.emp.name.localeCompare(b.emp.name);
      if (sortBy === "timein") return a.time_in.localeCompare(b.time_in);
      return 0;
    });
    return rows;
  }, [attendance, filters, sortBy, empById]);

  const exportCSV = () => {
    const shiftHours = settings.shift_hours || 9;
    const headers = [
      { label: "Date", get: (r) => r.date }, { label: "Employee", get: (r) => r.emp.name },
      { label: "Employee ID", get: (r) => r.emp.employee_number }, { label: "Company", get: (r) => r.emp.company },
      { label: "Department", get: (r) => r.emp.department }, { label: "Time In", get: (r) => r.time_in },
      { label: "Time Out", get: (r) => r.time_out || "" }, { label: "Total Hours", get: (r) => r.total_minutes != null ? fmtDuration(r.total_minutes) : "" },
      { label: "Overtime", get: (r) => fmtDuration(overtimeMinutes(r.total_minutes, shiftHours)) },
      { label: "Status", get: (r) => r.status }, { label: "Recorded By", get: (r) => r.status === "INSIDE" ? r.checked_in_by : r.checked_out_by },
      { label: "Remarks", get: (r) => [r.remarks_in, r.remarks_out].filter(Boolean).join(" / ") },
    ];
    downloadFile(`attendance-history-${todayStr()}.csv`, toCSV(filtered, headers), "text/csv");
  };

  return (
    <div>
      <SectionTitle title="Attendance History" sub={`${filtered.length} record(s)`} />

      <details style={{ marginBottom: 14, background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, padding: "10px 14px" }}>
        <summary style={{ cursor: "pointer", fontWeight: 600, fontSize: 13.5, color: C.navy }}>Filters &amp; Sort</summary>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginTop: 12 }}>
          <Field label="From"><input type="date" style={inputStyle} value={filters.dateFrom} onChange={(e) => setFilters((f) => ({ ...f, dateFrom: e.target.value }))} /></Field>
          <Field label="To"><input type="date" style={inputStyle} value={filters.dateTo} onChange={(e) => setFilters((f) => ({ ...f, dateTo: e.target.value }))} /></Field>
          <Field label="Employee (name/ID)"><input style={inputStyle} value={filters.employee} onChange={(e) => setFilters((f) => ({ ...f, employee: e.target.value }))} /></Field>
          <Field label="Guard">
            <select style={inputStyle} value={filters.guard} onChange={(e) => setFilters((f) => ({ ...f, guard: e.target.value }))}>
              <option value="">All</option>{guards.map((g) => <option key={g} value={g}>{g}</option>)}
            </select>
          </Field>
          <Field label="Company">
            <select style={inputStyle} value={filters.company} onChange={(e) => setFilters((f) => ({ ...f, company: e.target.value }))}>
              <option value="">All</option>{companies.map((c) => <option key={c} value={c}>{c}</option>)}
            </select>
          </Field>
          <Field label="Department">
            <select style={inputStyle} value={filters.department} onChange={(e) => setFilters((f) => ({ ...f, department: e.target.value }))}>
              <option value="">All</option>{departments.map((d) => <option key={d} value={d}>{d}</option>)}
            </select>
          </Field>
          <Field label="Status">
            <select style={inputStyle} value={filters.status} onChange={(e) => setFilters((f) => ({ ...f, status: e.target.value }))}>
              <option value="">All</option><option value="INSIDE">Inside</option><option value="CHECKED_OUT">Checked Out</option><option value="OVERTIME">Overtime</option>
            </select>
          </Field>
          <Field label="Sort by">
            <select style={inputStyle} value={sortBy} onChange={(e) => setSortBy(e.target.value)}>
              <option value="latest">Latest first</option><option value="earliest">Earliest first</option>
              <option value="name">Employee name</option><option value="timein">Time in</option>
            </select>
          </Field>
        </div>
        <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
          <Btn size="sm" tone="ghost" onClick={() => setFilters({ dateFrom: "", dateTo: "", employee: "", company: "", department: "", guard: "", status: "" })}>Clear filters</Btn>
          <Btn size="sm" tone="paper" icon={Download} onClick={exportCSV}>Export CSV</Btn>
        </div>
      </details>

      <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, overflow: "hidden" }}>
        {filtered.length === 0 ? <EmptyState icon={CalendarDays} title="No records match these filters" /> : (
          <TableScroll headers={["Date", "Employee", "ID", "Company", "Time In", "Time Out", "Total Hours", "Status", "Recorded By", "Remarks", ""]}>
            {filtered.slice(0, 200).map((r) => (
              <tr key={r.id}>
                <Td>{r.date}</Td><Td>{r.emp.name}</Td><TdMono>{r.emp.employee_number}</TdMono><Td>{r.emp.company}</Td>
                <TdMono>{fmtTime(r.time_in)}</TdMono><TdMono>{r.time_out ? fmtTime(r.time_out) : "—"}</TdMono>
                <Td>{r.total_minutes != null ? fmtDuration(r.total_minutes) : "—"}</Td>
                <Td><StatusBadge a={r} shiftHours={settings.shift_hours} /></Td>
                <Td>{r.status === "INSIDE" ? r.checked_in_by : r.checked_out_by}</Td>
                <Td>{[r.remarks_in, r.remarks_out].filter(Boolean).join(" / ") || "—"}</Td>
                <Td>{session.role === "admin" && (
                  <button onClick={() => setEditing(r)} style={{ background: "none", border: "none", color: C.navy, cursor: "pointer" }} title="Correct record"><Edit3 size={15} /></button>
                )}</Td>
              </tr>
            ))}
          </TableScroll>
        )}
      </div>

      {editing && (
        <CorrectionModal record={editing} onClose={() => setEditing(null)} attendance={attendance}
          persistAttendance={persistAttendance} audit={audit} persistAudit={persistAudit} session={session} notify={notify} />
      )}
    </div>
  );
}

function CorrectionModal({ record, onClose, attendance, persistAttendance, audit, persistAudit, session, notify }) {
  const [timeIn, setTimeIn] = useState(record.time_in || "");
  const [timeOut, setTimeOut] = useState(record.time_out || "");
  const [reason, setReason] = useState("");

  const save = async () => {
    if (!reason.trim()) { notify("A reason is required to correct a record", "error"); return; }
    const total_minutes = timeOut ? minutesBetween(record.date, timeIn, timeOut) : null;
    const updated = { ...record, time_in: timeIn, time_out: timeOut || null, total_minutes, status: timeOut ? "CHECKED_OUT" : "INSIDE", updated_at: Date.now() };
    delete updated.emp;
    const next = attendance.map((a) => (a.id === record.id ? updated : a));
    await persistAttendance(next);
    const logs = [];
    if (timeIn !== record.time_in) logs.push({ id: uid("log_"), attendance_id: record.id, action: "CORRECTION", old_value: `time_in=${record.time_in}`, new_value: `time_in=${timeIn}`, performed_by: session.name, reason, timestamp: Date.now() });
    if ((timeOut || null) !== record.time_out) logs.push({ id: uid("log_"), attendance_id: record.id, action: "CORRECTION", old_value: `time_out=${record.time_out || "—"}`, new_value: `time_out=${timeOut || "—"}`, performed_by: session.name, reason, timestamp: Date.now() });
    if (logs.length) await persistAudit([...logs, ...audit]);
    notify("Attendance record corrected");
    onClose();
  };

  return (
    <Modal title="Correct Attendance Record" onClose={onClose}>
      <div style={{ fontSize: 13, color: C.ink50, marginBottom: 12 }}>{record.emp?.name} · {record.date}</div>
      <Field label="Time In"><input type="time" step="1" style={inputStyle} value={timeIn} onChange={(e) => setTimeIn(e.target.value)} /></Field>
      <Field label="Time Out (leave blank if still inside)"><input type="time" step="1" style={inputStyle} value={timeOut} onChange={(e) => setTimeOut(e.target.value)} /></Field>
      <Field label="Reason for correction (required)"><textarea style={{ ...inputStyle, minHeight: 70 }} value={reason} onChange={(e) => setReason(e.target.value)} placeholder="e.g. Guard entered wrong time, correcting per CCTV footage" /></Field>
      <div style={{ background: C.paperDim, borderRadius: 8, padding: "8px 10px", fontSize: 12, color: C.ink50, marginBottom: 14 }}>
        Original: time_in {record.time_in}, time_out {record.time_out || "—"} — this change will be logged in the audit trail, not silently overwritten.
      </div>
      <Btn full tone="navy" onClick={save}>Save Correction</Btn>
    </Modal>
  );
}

function VisitorsScreen({ session, visitors, persistVisitors, notify, today }) {
  const [tab, setTab] = useState("inside");

  const inside = visitors.filter((v) => v.status === "INSIDE");
  const sorted = useMemo(() => [...visitors].sort((a, b) => (b.date + b.time_in).localeCompare(a.date + a.time_in)), [visitors]);

  const filteredHistory = useMemo(() => {
    if (!q.trim()) return sorted.slice(0, 100);
    const t = q.toLowerCase();
    return sorted.filter((v) => v.name.toLowerCase().includes(t) || (v.pass_number || "").toLowerCase().includes(t) || (v.company || "").toLowerCase().includes(t)).slice(0, 100);
  }, [sorted, q]);

  const logIn = async (data) => {
    const now = new Date();
    const rec = {
      id: uid("v_"), ...data, date: todayStr(now), time_in: nowTimeStr(now), time_out: null,
      status: "INSIDE", checked_in_by: session.name, checked_out_by: null, created_at: Date.now(), updated_at: Date.now(),
    };
    await persistVisitors([rec, ...visitors]);
    notify(`${data.name} logged in`);

  const checkOut = async (v) => {
    const now = new Date();

    await persistVisitors(visitors.map((x) => (x.id === v.id ? updated : x)));

  return (
    <div>
      <SectionTitle title="Visitors & Contractors" sub={`${inside.length} currently inside`} action={{ label: "+ Log In", onClick: () => setShowForm(true) }} />

        </div>

            <div key={v.id} style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 10, padding: "12px 14px" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8 }}>
                <div style={{ minWidth: 0 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 7, flexWrap: "wrap" }}>
                    <span style={{ fontWeight: 600, fontSize: 14.5, color: C.ink }}>{v.name}</span>
                    <Badge tone={v.type === "Contractor" ? "overtime" : "neutral"}>{v.type.toUpperCase()}</Badge>
                    {v.status === "INSIDE" ? <Badge tone="inside">INSIDE</Badge> : <Badge tone="out">CHECKED OUT</Badge>}
                  </div>
                  <div style={{ fontSize: 12.5, color: C.ink50, marginTop: 3 }}>
                    {v.company && <>{v.company} · </>}{v.purpose}
                  </div>
                  <div style={{ fontSize: 12, color: C.ink50, marginTop: 2 }}>
                    To see: {v.host_name || "—"} {v.department ? `(${v.department})` : ""}
                  </div>
                  <div style={{ fontFamily: FONT_MONO, fontSize: 11.5, color: C.navy, marginTop: 4 }}>
